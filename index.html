*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  font-size:16px; line-height:1.55;
}
body.locked{overflow:hidden}
h1,h2,h3,.num{font-family:'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand); outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px calc(150px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 2px 4px}
.top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.02em;line-height:1.15}
.top .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.sync{font-size:13px;color:var(--muted);text-align:right;line-height:1.35}
.sync b{display:block;font-weight:500;color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.dot.off{background:var(--warn)}

.pagebar{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:10px 14px;border:1.5px solid var(--edge);border-left-width:9px;border-radius:6px;background:var(--card);font-family:'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-size:21px;font-weight:800;line-height:1.25}
@supports (background:color-mix(in srgb,red 10%,white)){
  .pagebar.kid{background:color-mix(in srgb,var(--c-tuition) 13%,var(--card))}
  .pagebar.fam{background:color-mix(in srgb,var(--c-cram) 13%,var(--card))}
}
.pagebar.kid{border-left-color:var(--c-tuition)}
.pagebar.fam{border-left-color:var(--c-cram)}
.pagebar.sys{border-left-color:var(--c-other)}
.pagebar .pi{font-size:24px;line-height:1}

/* ledger slips */
.sec{background:var(--card);border:1.5px solid var(--edge);border-radius:6px;padding:14px 16px 16px;margin:14px 0}
.sec h2{margin:0;font-size:18px;font-weight:700}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.meta{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--brand);font-weight:500;font-size:14px;min-height:36px}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthnav h2{font-size:20px}
.iconbtn{width:44px;height:44px;border:1.5px solid var(--edge);background:var(--field);border-radius:6px;font-size:20px;line-height:1}

.split{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.split > div{padding:12px 4px 12px 0}
.split > div + div{padding-left:16px;border-left:1px dashed var(--line)}
.split .lbl{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.split .num{display:block;font-size:26px;font-weight:800;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.split .num small{font-size:13px;font-weight:500;color:var(--muted);margin-right:3px}
.tally{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 0;font-size:15px}
.tally + .tally{padding-top:4px}
.tally b{font-variant-numeric:tabular-nums}
.tally.big{font-size:17px;font-weight:700}
.tally.muted{color:var(--muted);font-size:14px}

/* rows */
.list{margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:11px 0 11px 10px;border-left:5px solid var(--kid,var(--line));margin-left:0}
.list li:last-child .row,.row:last-child{border-bottom:0}
.row .d{font-size:14px;color:var(--muted);min-width:38px;font-variant-numeric:tabular-nums}
.row .main{min-width:0}
.row .main b{display:block;font-weight:700;overflow-wrap:anywhere}
.row .main small{display:block;color:var(--muted);font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.row .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .amt .stamp{display:inline-block;margin-top:3px}
.catdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--cc,var(--c-other))}
.mhead{display:flex;justify-content:space-between;margin:14px 0 2px;font-size:15px;font-weight:700;border-bottom:1.5px solid var(--edge);padding-bottom:4px}

.pend{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0 10px 10px;border-left:5px solid var(--kid);border-bottom:1px dashed var(--line)}
.pend:last-child{border-bottom:0}
.pend .edit{background:none;border:0;padding:0;text-align:left;min-width:0}
.pend .edit b{display:block;overflow-wrap:anywhere}
.pend .edit small{display:block;color:var(--muted);font-size:13px}
.pend .right{text-align:right}
.pend .right b{display:block;font-variant-numeric:tabular-nums}
.paybtn{margin-top:6px;min-height:40px;padding:0 14px;border-radius:6px;border:1.5px solid var(--ok);background:transparent;color:var(--ok);font-weight:700}

/* stamps */
.stamp{display:inline-block;padding:0 6px;border:2px solid currentColor;border-radius:4px;font-size:12px;font-weight:800;letter-spacing:.08em;line-height:1.5;transform:rotate(-4deg);white-space:nowrap}
.stamp.paid{color:var(--ok)}
.stamp.wait{color:var(--warn);border-style:dashed}
.stamp.soon{color:var(--warn)}
.stamp.late{color:var(--bad)}

/* kid ledger */
.kid{border-left:6px solid var(--kid);padding:2px 0 8px 12px;margin:0 0 14px}
.kid:last-child{margin-bottom:0}
.kid header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kid h3{margin:0;font-size:18px;font-weight:700}
.kid header .num{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.kid .ln{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:8px;font-size:14px;margin-top:5px}
.kid .bar{height:8px;background:var(--field);border-radius:2px;overflow:hidden}
.kid .bar i{display:block;height:100%;border-radius:2px}
.kid .ln b{font-variant-numeric:tabular-nums;font-weight:500}
.kid .ytd{margin-top:6px;font-size:13px;color:var(--muted)}

/* chart */
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:'Noto Sans TC',sans-serif}
.chart text.cur{fill:var(--ink);font-weight:700}
.chart .val{font-size:9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* filters */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.filters label{font-size:13px;color:var(--muted);display:block}
.filters select{width:100%;min-height:44px;border:1.5px solid var(--edge);background:var(--field);border-radius:6px;padding:0 8px}

/* yearly */
.ytable{font-size:12.5px;font-variant-numeric:tabular-nums}
.ytable .yr{display:grid;grid-template-columns:40px repeat(4,1fr) 1.1fr;gap:3px;align-items:center;width:100%;text-align:right;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 0;min-height:40px}
.ytable .yr > :first-child{text-align:left;font-weight:500}
.ytable .yh{color:var(--muted);font-size:11.5px;border-bottom:1.5px solid var(--edge);min-height:0;padding:0 0 6px}
.ytable .yh i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.ytable .yr.now{background:var(--field)}
.ytable .yr .z{color:var(--muted)}
.ytable .yr .cv{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px;background:var(--kid)}
.ytable .yr.sub{border-bottom:0;padding:5px 0;min-height:0;color:var(--muted);font-size:12.5px}
.ytable .yr.sub:first-of-type{padding-top:2px}
.ytable .kidbox{border-bottom:1px dashed var(--line);padding:2px 0 8px 10px;background:var(--field)}
.ytable .golink{display:block;width:100%;text-align:left;background:none;border:0;color:var(--brand);font-size:13px;font-weight:500;padding:6px 0 2px;min-height:34px}
.ytable .yr .ar{color:var(--muted);font-weight:400}
.ytable .yr b{font-weight:700}
.ytable .yf{border-top:1.5px solid var(--edge);border-bottom:0;font-weight:700;font-size:14px}
.catln{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:8px;font-size:14px;margin-top:8px}
.catln .bar{height:10px;background:var(--field);border-radius:2px;overflow:hidden}
.catln .bar i{display:block;height:100%}
.catln.catbtn{grid-template-columns:88px 1fr auto;width:100%;background:none;border:0;padding:4px 0;min-height:40px;text-align:left;margin-top:4px}
.catln .ar{color:var(--muted);font-size:12px}
.cdetail{margin:4px 0 12px;border-top:1.5px solid var(--edge)}
.cdetail .row{padding-top:9px;padding-bottom:9px}
.catln b{font-variant-numeric:tabular-nums;font-weight:500}

.split2{display:grid;grid-template-columns:1fr 132px;gap:8px;margin-bottom:8px}
.pmode-hint.bad{color:var(--bad)}

.payer{margin:0 0 16px}
.payer:last-child{margin-bottom:0}
.payer .phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;background:none;border:0;padding:4px 0;min-height:44px;text-align:left}
.payer .pn{font-family:'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-size:18px;font-weight:700}
.kid .khead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;background:none;border:0;padding:4px 0;min-height:44px;text-align:left}
.kid .khead .kn{font-family:'Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-size:18px;font-weight:700}
.kid .khead .ar{color:var(--muted);font-weight:400;font-size:14px}
.kid .lnb{grid-template-columns:82px 1fr auto;width:100%;background:none;border:0;padding:4px 0;min-height:38px;text-align:left;margin-top:0}
.kid .lnb .ar{color:var(--muted);font-size:12px}
.kid .kdetail{margin-top:10px;border-top:1.5px solid var(--edge)}
.kid .kdetail .row{padding-top:9px;padding-bottom:9px;border-left-width:0;padding-left:0}
.payer .phead .ar{color:var(--muted);font-weight:400;font-size:14px}
.payer .pdetail{margin-top:10px;border-top:1.5px solid var(--edge)}
.payer .pdetail .row{padding-top:9px;padding-bottom:9px}
.payer .pnote{margin:6px 0 0;font-size:13px}
.payer h3{margin:0;font-size:18px;font-weight:700}
.payer .num{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.payer .bar{height:10px;background:var(--field);border-radius:2px;overflow:hidden;margin:6px 0 4px}
.payer .bar i{display:block;height:100%;background:var(--brand)}
.payer p{margin:0;font-size:13px;color:var(--muted)}

.famtotal .lbl{font-size:14px;color:var(--muted)}
.famtotal .num{display:block;font-size:34px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.famtotal .num small{font-size:15px;font-weight:500;color:var(--muted);margin-right:4px}
.budget{margin-top:10px}
.budget .bar{height:12px;background:var(--field);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.budget .bar i{display:block;height:100%;background:var(--brand)}
.budget .bar i.warn{background:var(--warn)}
.budget .bar i.bad{background:var(--bad)}
.catln.catbtn.wide{grid-template-columns:122px 1fr auto}
.catln.wide > span:first-child{line-height:1.25;overflow-wrap:anywhere}
.catln.on{background:var(--field)}
.catln.on > span:first-child{font-weight:700}
.fbar text{fill:var(--muted);font-size:10px;font-family:'Noto Sans TC',sans-serif}
.fbar text.cur{fill:var(--ink);font-weight:700}

.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px 4px;-webkit-overflow-scrolling:touch}
.mtable{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}
.mtable th,.mtable td{padding:8px 9px;text-align:right;white-space:nowrap;border-bottom:1px dashed var(--line);background:var(--card)}
.mtable thead th{border-bottom:1.5px solid var(--edge);color:var(--muted);font-weight:500;font-size:12px}
.mtable th:first-child,.mtable td:first-child{position:sticky;left:0;z-index:1;text-align:left;border-right:1px solid var(--line);font-weight:500}
.mtable td:first-child{white-space:normal;min-width:104px;max-width:132px;line-height:1.3}
.mtable td:first-child .sw{margin-right:6px;vertical-align:0}
.mtable tfoot td{border-top:1.5px solid var(--edge);font-weight:700}
.mtable tfoot tr + tr td{border-top:0}
.mtable .cur{background:var(--field)}
.mtable td:first-child.cur,.mtable th:first-child.cur{background:var(--card)}
.mtable .tot{font-weight:700;border-left:1px solid var(--line)}
.mtable .z{color:var(--muted)}
.mtable .neg{color:var(--bad)}
.mtable th button{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;min-height:32px}
.mtable th button[aria-current="true"]{color:var(--ink);font-weight:700}

.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.fchip{min-height:38px;padding:0 13px;border:1.5px solid var(--line);border-radius:19px;background:var(--field);font-weight:500}
.fchip[aria-pressed="true"]{border-color:var(--edge);background:var(--card);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--edge)}
.pol{background:var(--card);border:1.5px solid var(--edge);border-left:7px solid var(--f-insurance);border-radius:6px;padding:8px 12px;margin:8px 0}
.pol.ended{opacity:.7}
.searchbox{width:100%;min-height:46px;border:1.5px solid var(--edge);background:var(--field);border-radius:6px;padding:8px 12px;margin:2px 0 10px}
.pol .ph{min-height:48px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left}
.pol .ph .t b{display:block;font-size:17px;overflow-wrap:anywhere}
.pol .ph .t small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.pol .ph .p{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pol .ph .p b{display:block;font-size:17px}
.pol .ph .p small{color:var(--muted);font-size:13px}
.pol .pm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.pol .lnks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lnk{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border:1.5px solid var(--brand);border-radius:6px;color:var(--brand);font-weight:700;font-size:14px;text-decoration:none}
.pol .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pol .acts .btn{min-height:40px;padding:0 14px;font-size:14px}
.pol h4{margin:14px 0 4px;font-size:14px;color:var(--muted);font-weight:700}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;font-size:14px;margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.cov{list-style:none;margin:0;padding:0}
.cov li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:6px 0;font-size:14px}
.cov li b{text-align:right;font-variant-numeric:tabular-nums}
.covrow{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;margin-bottom:6px}
.lkrow{display:grid;grid-template-columns:.8fr 1.3fr 44px;gap:6px;margin-bottom:6px}
.covrow .iconbtn,.lkrow .iconbtn{width:44px;height:46px}
.field .covrow input,.field .lkrow input{width:100%;min-height:46px;border:1.5px solid var(--edge);background:var(--field);border-radius:6px;padding:8px 10px}
.pagebar.ins{border-left-color:var(--f-insurance)}
@supports (background:color-mix(in srgb,red 10%,white)){.pagebar.ins{background:color-mix(in srgb,var(--f-insurance) 14%,var(--card))}}

.chk{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 12px;border:1.5px solid var(--edge);border-radius:6px;background:var(--field);font-weight:700;cursor:pointer}
.chk input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--warn)}
.chk small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.pagebar.card{border-left-color:var(--f-utility)}
@supports (background:color-mix(in srgb,red 10%,white)){.pagebar.card{background:color-mix(in srgb,var(--f-utility) 14%,var(--card))}}
.pagebar.car{border-left-color:var(--c-meal)}
@supports (background:color-mix(in srgb,red 10%,white)){.pagebar.car{background:color-mix(in srgb,var(--c-meal) 14%,var(--card))}}
.pagebar.km{border-left-color:var(--f-fun)}
@supports (background:color-mix(in srgb,red 10%,white)){.pagebar.km{background:color-mix(in srgb,var(--f-fun) 14%,var(--card))}}
.pagebar.les{border-left-color:var(--c-talent)}
@supports (background:color-mix(in srgb,red 10%,white)){.pagebar.les{background:color-mix(in srgb,var(--c-talent) 14%,var(--card))}}
.pagebar.adv{border-left-color:var(--f-wife)}
@supports (background:color-mix(in srgb,red 10%,white)){.pagebar.adv{background:color-mix(in srgb,var(--f-wife) 14%,var(--card))}}
.pagebar.inc{border-left-color:var(--ok)}
@supports (background:color-mix(in srgb,red 10%,white)){.pagebar.inc{background:color-mix(in srgb,var(--ok) 14%,var(--card))}}
.pagebar.maj{border-left-color:var(--warn)}
@supports (background:color-mix(in srgb,red 10%,white)){.pagebar.maj{background:color-mix(in srgb,var(--warn) 14%,var(--card))}}
.star{color:var(--warn)}

.cellbtn{background:none;border:0;padding:3px 4px;font:inherit;color:inherit;border-radius:4px;text-decoration:underline dotted;text-underline-offset:3px;min-height:30px;cursor:pointer}
.cellbtn[aria-pressed="true"]{background:var(--ink);color:var(--card);text-decoration:none;font-weight:700}
.mtable td:first-child .cellbtn{text-align:left;font-weight:500}
.mtable td.tot .cellbtn{font-weight:700}
.statdetail{margin-top:12px;border-top:1.5px solid var(--edge);padding-top:6px}

.plrow,.discrow{display:grid;grid-template-columns:104px 1fr 44px;gap:6px;margin-bottom:8px}
.plrow > select[data-f=tool],.discrow > select[data-f=tool],.discrow > input[data-f=label]{grid-column:1 / -1}
.plrow .iconbtn,.discrow .iconbtn{width:44px;height:46px}
.pt-auto{margin:8px 0 0;padding:8px 12px;border:1.5px dashed var(--edge);border-radius:6px;background:var(--field);font-weight:700}
.stmt{background:var(--card);border:1.5px solid var(--edge);border-radius:6px;padding:10px 12px 8px;margin:12px 0}
.stmt-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stmt-h b{font-size:17px;overflow-wrap:anywhere}
.stmt-s{margin:2px 0 8px;font-size:13px;color:var(--muted);line-height:1.5}
.stmt .li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:8px 0;font:inherit;color:inherit}
.stmt .li .il{min-width:0}
.stmt .li .il b{display:block;font-weight:500;overflow-wrap:anywhere}
.stmt .li .il small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.stmt .li .ia{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.stmt .sr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-variant-numeric:tabular-nums}
.stmt .sr.tot{border-top:1.5px solid var(--edge);margin-top:4px;padding-top:10px;font-size:19px;font-weight:800}
.stmt .sr.tot small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.lescard{background:var(--card);border:1.5px solid var(--edge);border-left:7px solid var(--kid,var(--c-talent));border-radius:6px;padding:10px 12px;margin:10px 0}
.lescard .lh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lescard .lh b{font-size:17px;overflow-wrap:anywhere}
.lescard .lh small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.lescard .left{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lescard .left b{font-size:24px;line-height:1.1}
.lescard .lbar{height:10px;background:var(--field);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.lescard .lbar i{display:block;height:100%}
.lescard .lm{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.lescard .lacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lescard .lacts .btn{min-height:42px;padding:0 14px;font-size:14px}
.lescard .llogs{margin-top:8px;border-top:1px dashed var(--line)}
.mtable tr.grp td{background:var(--field)}
.pctnote{grid-column:1 / -1;font-size:13px;color:var(--warn);font-weight:700}
.field .plrow input,.field .discrow input{width:100%;min-height:46px;border:1.5px solid var(--edge);background:var(--field);border-radius:6px;padding:8px 10px}

/* nav + fab */
.nav{overflow-x:auto;scrollbar-width:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--edge);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:1 1 0;min-width:0;min-height:62px;padding:0 2px;background:none;border:0;border-top:4px solid transparent;margin-top:-1.5px;font-weight:500;font-size:13px;line-height:1.25;color:var(--muted)}
.nav::-webkit-scrollbar{display:none}
.subnav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.subnav button{min-height:42px;padding:0 14px;border:1.5px solid var(--line);border-radius:21px;background:var(--card);font-weight:500;font-size:14px}
.subnav button[aria-current="page"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:700}
.nav .ic{font-size:17px;line-height:1}
.nav button.sep{border-left:1px solid var(--line)}
.nav button[aria-current="page"]{border-top-color:var(--brand);color:var(--ink);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:21;min-height:52px;padding:0 22px;border-radius:26px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.28)}
@media(min-width:720px){.fab{right:calc(50% - 340px + 16px)}}
@media(min-width:900px){.wrap{max-width:860px}.fab{right:calc(50% - 430px + 16px)}.sheet{max-width:620px}}

/* buttons */
.btn{min-height:48px;padding:0 20px;border-radius:6px;border:1.5px solid var(--edge);background:var(--field);font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn[disabled]{opacity:.55;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btnrow .grow{flex:1}

/* sheet */
#sheet-root[hidden]{display:none}
.backdrop{position:fixed;inset:0;background:rgba(10,20,30,.55);z-index:40}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-top:2px solid var(--edge);border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .2s ease-out;max-width:560px;margin:0 auto}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
@media(min-width:720px){.sheet{top:50%;bottom:auto;transform:translateY(-50%);border-radius:10px;border:1.5px solid var(--edge);animation:none}}
.sheet h2{margin:0 0 10px;font-size:20px;font-weight:800}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.field{margin:12px 0}
.field > label,.field > .lab{display:block;font-size:14px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;min-height:46px;border:1.5px solid var(--edge);background:var(--field);border-radius:6px;padding:8px 10px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border:1.5px solid var(--line);border-radius:22px;background:var(--field);font-weight:500}

.chip .sw{width:12px;height:12px;border-radius:50%}
.swatch span{width:42px;padding:0;justify-content:center}
.swatch .sw{width:22px;height:22px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.msg{font-size:15px;margin:6px 0 4px}

.empty{text-align:center;padding:28px 12px}
.empty h2{margin-bottom:6px}
.empty p{color:var(--muted);margin:0 0 14px}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
.note.warn{color:var(--warn)}

#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;z-index:60;max-width:88vw;text-align:center}
#toast[hidden]{display:none}

function addMonthsDate(ds,k){const [y,m,d]=ds.split('-').map(Number);const t=new Date(y,m-1+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(Math.min(d,last))}

/* ---------- storage layer ---------- */
function loadLocal(){try{const j=JSON.parse(localStorage.getItem('kidledger:v1')||'null');if(j){S.children=j.children||[];S.records=j.records||[];S.family=j.family||[];S.policies=j.policies||[];S.budget=+j.budget||0;if(Array.isArray(j.payTools))S.payTools=j.payTools;if(j.cfBuffer>=0)S.cfBuffer=+j.cfBuffer;if(Array.isArray(j.accounts))S.accounts=j.accounts;if(Array.isArray(j.flows))S.flows=j.flows;if(Array.isArray(j.cardAdj))S.cardAdj=j.cardAdj;if(Array.isArray(j.standing))S.standing=j.standing;if(Array.isArray(j.lessons))S.lessons=j.lessons;if(Array.isArray(j.lessonLogs))S.lessonLogs=j.lessonLogs;if(Array.isArray(j.kidMoney))S.kidMoney=j.kidMoney;if(Array.isArray(j.einvoiceWin))S.einvoiceWin=j.einvoiceWin;if(j.kmBonus&&typeof j.kmBonus==='object')S.kmBonus=j.kmBonus;if(j.car&&typeof j.car==='object')S.car=j.car;if(Array.isArray(j.carPlan))S.carPlan=j.carPlan;if(Array.isArray(j.carAsks))S.carAsks=j.carAsks;if(Array.isArray(j.cardGroups))S.cardGroups=j.cardGroups;if(Array.isArray(j.carLogs))S.carLogs=j.carLogs;if(Array.isArray(j.carFuel))S.carFuel=j.carFuel;if(Array.isArray(j.kmSources))S.kmSources=j.kmSources;if(j.cardState&&typeof j.cardState==='object')S.cardState=j.cardState}}catch(e){}}
function persistLocal(){try{localStorage.setItem('kidledger:v1',JSON.stringify({children:S.children,records:S.records,family:S.family,policies:S.policies,payTools:S.payTools,cfBuffer:S.cfBuffer,cardState:S.cardState,accounts:S.accounts,flows:S.flows,standing:S.standing,cardAdj:S.cardAdj,lessons:S.lessons,lessonLogs:S.lessonLogs,kidMoney:S.kidMoney,kmSources:S.kmSources,einvoiceWin:S.einvoiceWin,kmBonus:S.kmBonus,car:S.car,carPlan:S.carPlan,carAsks:S.carAsks,cardGroups:S.cardGroups,carLogs:S.carLogs,carFuel:S.carFuel,budget:S.budget}))}catch(e){}}
async function put(coll,obj){
  const {id,...data}=obj;
  if(S.mode==='sync'){await S.db.collection(coll).doc(id).set(data);return}
  const arr=coll==='children'?S.children:coll==='policies'?S.policies:coll==='flows'?S.flows:coll==='standing'?S.standing:coll==='cardadj'?S.cardAdj:coll==='lessons'?S.lessons:coll==='lessonlogs'?S.lessonLogs:coll==='kidmoney'?S.kidMoney:coll==='carlogs'?S.carLogs:coll==='carfuel'?S.carFuel:(obj.kind==='family'?S.family:S.records);
  const i=arr.findIndex(x=>x.id===id);
  if(i>=0)arr[i]=obj;else arr.push(obj);

}
async function del(coll,id){

  if(coll==='children')S.children=S.children.filter(x=>x.id!==id);else if(coll==='policies')S.policies=S.policies.filter(x=>x.id!==id);else if(coll==='flows')S.flows=S.flows.filter(x=>x.id!==id);else if(coll==='standing')S.standing=S.standing.filter(x=>x.id!==id);else if(coll==='cardadj')S.cardAdj=S.cardAdj.filter(x=>x.id!==id);else if(coll==='lessons')S.lessons=S.lessons.filter(x=>x.id!==id);else if(coll==='lessonlogs')S.lessonLogs=S.lessonLogs.filter(x=>x.id!==id);else if(coll==='kidmoney')S.kidMoney=S.kidMoney.filter(x=>x.id!==id);else if(coll==='carlogs')S.carLogs=S.carLogs.filter(x=>x.id!==id);else if(coll==='carfuel')S.carFuel=S.carFuel.filter(x=>x.id!==id);else{S.records=S.records.filter(x=>x.id!==id);S.family=S.family.filter(x=>x.id!==id)}

  return {id:'grp:'+g.id,name:g.name,type:'credit',cardNo:'',closeDay:(mem[0]&&mem[0].closeDay)||0,payDay:(mem[0]&&mem[0].payDay)||0,autoAccountId:accts.length===1?accts[0]:'',autoAccount:'',isGroup:true,members:(g.members||[]).slice()};
}
function calcPayDates(tool,dateStr){
  if(!tool)return {close:'',due:''};
  const C=+tool.closeDay||0,P=+tool.payDay||0;
  if(!C&&!P)return {close:'',due:''};
  const dayOf=(ymKey,day)=>{const q=ymKey.split('-').map(Number);const last=new Date(q[0],q[1],0).getDate();return ymKey+'-'+pad(Math.min(day,last))};
  const ym=dateStr.slice(0,7);
  let close='',due='';
  if(C){close=dayOf(ym,C);if(dateStr>close)close=dayOf(addMonths(ym,1),C)}
  if(P){
    const ref=close||dateStr;
    let cand=dayOf(ref.slice(0,7),P);
    if(cand<=ref)cand=dayOf(addMonths(ref.slice(0,7),1),P);
    due=cand;
  }
  return {close:close,due:due};
}

}
function dateOfTs(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function acctOutflows(a,after,upto){
  const out=[];
  cfBills().forEach(b=>{
    const actual=b.paidAmount!==null?b.paidAmount:b.payable;
    if(!b.paid||b.acctId!==a.id||actual<=0)return;
    const st=S.cardState[b.key]||{},ud=st.updatedAt?dateOfTs(st.updatedAt):b.due,pd=b.paidDate||(ud<b.due?ud:b.due);
    if(pd>after&&pd<=upto)out.push({date:pd,kind:'bill',amount:actual,label:b.name+' 信用卡帳款'});
  });
  S.payTools.forEach(t=>{
    if(!isAutoPrepaid(t)||t.topupMode!=='account'||toolAcctId(t)!==a.id)return;
    prepaidSim(t).events.forEach(e=>{if(e.date>after&&e.date<=upto)out.push({date:e.date,kind:'topup',amount:e.amount,label:t.name+' 自動儲值'})});
  });
  return out;
}
function acctNow(a){

function instSplit(total,n,first){
  total=+total||0;n=+n||0;
  const out=[];
  if(n<2)return [total];
  const f=+first;
  if(f>0&&f<total){
    const rest=total-f,base=Math.floor(rest/(n-1)),rem=rest-base*(n-1);
    out.push(f);
    for(let k=1;k<n;k++)out.push(base+(k===n-1?rem:0));
  }else{
    const base=Math.floor(total/n),rem=total-base*n;
    for(let k=0;k<n;k++)out.push(base+(k===0?rem:0));
  }
  return out;
}
function instAmounts(l){
  const n=l&&l.inst?+l.inst.n:0;
  if(!(n>1)||!l.payDue)return null;
  const total=+l.amount||0,parts=instSplit(total,n,l.inst.first),fee=+l.inst.fee||0,out=[];
  for(let k=0;k<n;k++){
    const pr=parts[k];
    out.push({k:k+1,n:n,principal:pr,fee:fee,amount:pr+fee,total:total,due:addMonthsDate(l.payDue,k),close:l.payClose?addMonthsDate(l.payClose,k):''});
  }
  return out;
}

function payLinesOf(r){

function prepaidSim(t){
  const bd=t.balanceDate||todayStr(),th=+t.autoThreshold,amt=+t.autoAmount,events=[],today=todayStr(),tl=[];
  payRecs().forEach(r=>{if(r.date>bd){const v=spendOn(r,t.id);if(v)tl.push({date:r.date,ord:r.createdAt||0,delta:-v})}});
  allFlows(today).forEach(f=>{
    if(f.date>bd&&f.date<=today){
      if(f.toId===t.id)tl.push({date:f.date,ord:f.createdAt||0,delta:+f.amount||0});
      if(f.fromId===t.id)tl.push({date:f.date,ord:f.createdAt||0,delta:-(+f.amount||0)});
    }
  });
  tl.sort((x,y)=>x.date.localeCompare(y.date)||x.ord-y.ord);
  let bal=+t.balance;
  tl.forEach(e=>{
    bal+=e.delta;
    if(e.delta<0){let g=0;while(bal<th&&g++<50){bal+=amt;events.push({date:e.date,amount:amt})}}
  });
  return {balance:bal,events:events};
}

function cardBillGroups(){
  const map={};
  const add=(cardId,name,due,close,amount,n,via,item)=>{
    const grp=cardId?cardGroupOf(cardId):null,gid=cardId?cardGroupKey(cardId):'';
    const key=(gid||name)+':'+due,tool=grp?cardGroupTool(grp):(cardId?(S.payTools.find(x=>x.id===cardId)||null):null);
    const g=map[key]||(map[key]={key:key,cardId:gid||'',tool:tool,name:tool?toolLabel(tool):name,due:due,close:close||'',amount:0,n:0,via:{},items:[],hasId:!!cardId,isGroup:!!grp});
    g.amount+=amount;g.n+=n;
    if(!g.close&&close)g.close=close;
    if(via)g.via[via.name]=(g.via[via.name]||0)+via.amount;
    if(item)g.items.push(item);
  };
  payRecs().forEach(r=>{
    payLinesOf(r).forEach(l=>{
      if(!l.payDue)return;
      const cid=l.fundId||l.toolId;
      if(isAutoPrepaid(S.payTools.find(x=>x.id===l.toolId)))return;
      const tool=cid?S.payTools.find(x=>x.id===cid):null;
      if(tool&&tool.type!=='credit')return;
      const nm0=l.fundName||l.toolName||'信用卡',plan=instAmounts(l);
      if(plan){
        plan.forEach(pp=>add(cid,nm0,pp.due,pp.close,pp.amount,1,null,{kind:'rec',r:r,amount:pp.amount,via:'',inst:{k:pp.k,n:pp.n,fee:pp.fee,total:pp.total},toolName:nm0}));
      }else{
        add(cid,nm0,l.payDue,l.payClose,+l.amount||0,1,(l.fundName&&l.toolName)?{name:l.toolName,amount:+l.amount||0}:null,{kind:'rec',r:r,amount:+l.amount||0,via:(l.fundName&&l.toolName)?l.toolName:'',toolName:nm0});
      }
    });
  });
  S.cardAdj.forEach(a=>{
    const tool=S.payTools.find(x=>x.id===a.cardId);
    add(a.cardId,tool?toolLabel(tool):(a.cardName||'信用卡'),a.due,a.close||'',+a.amount||0,1,null,{kind:'adj',a:a,amount:+a.amount||0});
  });
  S.payTools.forEach(t=>{
    if(!isAutoPrepaid(t)||t.topupMode!=='credit')return;
    const card=fundOf(t);
    if(!card)return;
    prepaidSim(t).events.forEach(e=>{
      const c=calcPayDates(card,e.date);
      if(c.due)add(card.id,toolLabel(card),c.due,c.close,e.amount,1,{name:t.name,amount:e.amount},{kind:'sim',date:e.date,label:t.name+' 自動加值',amount:e.amount});
    });
  });
  const outG=Object.keys(map).map(k=>map[k]);
  outG.forEach(g=>{
    g.dueOrig=g.due;
    const st=S.cardState[g.key]||{};
    if(st.dueOverride&&/^\d{4}-\d{2}-\d{2}$/.test(st.dueOverride)){g.due=st.dueOverride;g.dueNote=st.dueNote||''}
  });
  return outG;
}

async function runImport(){
  const data=window.__importData;
  if(!data||S.mode!=='sync'||!S.db)return;
  S.importReady=false;render();
  const colls=Object.keys(data);
  let done=0,total=0,failed=0;
  colls.forEach(c=>{total+=Object.keys(data[c]||{}).length});
  for(const coll of colls){
    const docs=data[coll]||{};
    for(const docId of Object.keys(docs)){
      try{
        await S.db.collection(coll).doc(docId).set(docs[docId]);
        done++;
      }catch(e){failed++}
      S.importStatus='匯入中… '+done+'/'+total+(failed?'（'+failed+' 筆失敗）':'');
      render();
    }
  }
  S.importStatus='匯入完成：成功 '+done+' 筆'+(failed?'，失敗 '+failed+' 筆':'')+'。畫面應該會自動更新，如果沒有請重新整理頁面。';
  window.__importData=null;render();
  toast('匯入完成');
}

function errMsg(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')return '資料筆數已達上限，請先刪除舊紀錄';
  if(c==='invalid_argument')return '無法儲存：可能沒有編輯權限';

  if(c==='resource_exhausted')return '操作太頻繁，請稍後再試';

}

  }

  // kids
  h+='<section class="sec"><div class="sec-head"><h2>每位孩子</h2><span class="meta">'+(+ym.split('-')[1])+' 月・點名字或項目看明細</span></div>';
  const GN={tuition:'學費',cram:'補習費',talent:'才藝課',other:'其他'};
  S.children.forEach(c=>{
    const rs=recs.filter(r=>r.childId===c.id);
    const a=sum(rs,r=>groupOf(r.category)==='tuition'),b=sum(rs,r=>groupOf(r.category)==='cram'),t=sum(rs,()=>true),tl=sum(rs,r=>groupOf(r.category)==='talent'),o=t-a-b-tl;
    const yr=sum(S.kr,r=>r.childId===c.id&&r.date.slice(0,4)===ym.slice(0,4));

      const on=openG===g;

    };

      line('tuition',a,'var(--c-tuition)')+line('cram',b,'var(--c-cram)')+line('talent',tl,'var(--c-talent)')+line('other',o,'var(--c-other)')+
      '<p class="ytd">'+ym.slice(0,4)+' 年累計 '+money(yr)+'</p>';
    if(openAll||openG){
      const list=openAll?rs:rs.filter(r=>groupOf(r.category)===openG);
      const title=openAll?'全部':GN[openG];
      h+='<div class="kdetail"><p class="meta pnote">'+esc(c.name)+'・'+(+ym.split('-')[1])+' 月'+title+'　'+list.length+' 筆・'+money(sum(list,()=>true))+'，點一筆可查看或修改</p>';
      if(!list.length)h+='<p class="note">這個月還沒有這類紀錄。</p>';
      list.slice().sort((x,y)=>y.date.localeCompare(x.date)||(y.createdAt||0)-(x.createdAt||0)).forEach(r=>{
        const cat=catOf(r.category);
        h+='<button class="row" data-action="edit-rec" data-id="'+esc(r.id)+'"><span class="d">'+mdLabel(r.date)+'</span>'+
          '<span class="main"><b>'+esc(r.title)+'</b><small><i class="catdot" style="--cc:var(--c-'+cat.id+')"></i>'+cat.name+(r.org?'・'+esc(r.org):'')+'</small>'+
          (payerLabel(r)?'<small>'+payerLabel(r)+'</small>':'')+'</span>'+
          '<span class="amt">'+money(r.amount)+statusTag(r)+'</span></button>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='</section>';

  h+=trend();
  return h;
}

function trend(){
  const end=S.oEnd||S.month;
  const months=[];for(let i=5;i>=0;i--)months.push(addMonths(end,-i));
  const data=months.map(m=>{const rs=S.kr.filter(r=>ymOf(r.date)===m);const a=sum(rs,r=>groupOf(r.category)==='tuition'),b=sum(rs,r=>groupOf(r.category)==='cram'),t=sum(rs,()=>true);return{m,a,b,o:t-a-b,t}});
  const max=Math.max(1,...data.map(d=>d.t));
  const W=320,H=160,pb=22,pt=18,bw=32,gap=(W-6*bw)/7,ph=H-pb-pt;
  const short=n=>n>=10000?(n/10000).toFixed(1).replace(/\.0$/,'')+'萬':num(n);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="近六個月支出">';
  s+='<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" style="stroke:var(--edge)" stroke-width="1.5"/>';
  data.forEach((d,i)=>{
    const x=gap+i*(bw+gap),on=S.oChart===d.m;let y=H-pb;
    const mn=+d.m.split('-')[1];
    s+='<g role="button" tabindex="0" data-action="toggle-ochart" data-month="'+d.m+'" aria-label="'+mn+' 月，合計 '+num(d.t)+' 元，點一下看明細" aria-pressed="'+on+'" style="cursor:pointer">';
    s+='<rect x="'+(x-gap/2).toFixed(1)+'" y="0" width="'+(bw+gap).toFixed(1)+'" height="'+H+'" style="fill:'+(on?'var(--field)':'transparent')+'"/>';
    [['a','tuition'],['b','cram'],['o','other']].forEach(p=>{const h=d[p[0]]/max*ph;if(h>0){y-=h;s+='<rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+h.toFixed(1)+'" style="fill:var(--c-'+p[1]+')"/>'}});
    if(d.t>0)s+='<text class="val'+(on?' cur':'')+'" x="'+(x+bw/2)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+short(d.t)+'</text>';
    s+='<text class="'+(d.m===S.month||on?'cur':'')+'" x="'+(x+bw/2)+'" y="'+(H-7)+'" text-anchor="middle">'+mn+'月</text></g>';
  });
  s+='</svg>';
  let cd='';
  const sel=data.find(d=>d.m===S.oChart);
  if(sel){
    const list=S.kr.filter(r=>ymOf(r.date)===sel.m).sort((x,y)=>y.date.localeCompare(x.date)||(y.createdAt||0)-(x.createdAt||0));
    cd='<div class="cdetail" style="margin-top:12px"><p class="meta pnote"><b>'+(+sel.m.split('-')[1])+' 月</b>　'+list.length+' 筆・'+money(sel.t)+'（學費 '+num(sel.a)+'・補習費 '+num(sel.b)+'・其他 '+num(sel.o)+'）</p>';
    if(!list.length)cd+='<p class="note">這個月沒有紀錄。</p>';
    list.forEach(r=>{
      const k=childOf(r.childId),cat=catOf(r.category);
      cd+='<button class="row" data-action="edit-rec" data-id="'+esc(r.id)+'" style="--kid:'+esc(k.color)+'"><span class="d">'+mdLabel(r.date)+'</span>'+
        '<span class="main"><b>'+esc(r.title)+'</b><small>'+esc(k.name)+'・<i class="catdot" style="--cc:var(--c-'+cat.id+')"></i>'+cat.name+(r.org?'・'+esc(r.org):'')+'</small>'+
        (payerLabel(r)?'<small>'+payerLabel(r)+'</small>':'')+'</span>'+
        '<span class="amt">'+money(r.amount)+statusTag(r)+'</span></button>';
    });
    cd+='<button class="linkbtn" data-action="goto-detail" data-month="'+sel.m+'">到明細頁查看 '+(+sel.m.split('-')[1])+' 月 ›</button></div>';
  }
  const m0=months[0].split('-'),m5=months[5].split('-');
  const range=(m0[0]===m5[0]?m0[0]+' 年 '+(+m0[1])+' 月':m0[0]+' 年 '+(+m0[1])+' 月')+' – '+(m0[0]===m5[0]?'':m5[0]+' 年 ')+(+m5[1])+' 月';
  const navRow='<div class="monthnav"><button class="iconbtn" data-action="opre" aria-label="往前一個月">‹</button><div style="text-align:center"><h2>近六個月</h2><span class="meta">'+range+'</span></div><button class="iconbtn" data-action="opost" aria-label="往後一個月">›</button></div>'+
    (S.oEnd&&S.oEnd!==S.month?'<button class="linkbtn" data-action="oreset" style="margin:-4px 0 4px">回到目前月份</button>':'');
  return '<section class="sec chart">'+navRow+'<p class="meta" style="margin:0 0 4px;text-align:center">點長條看該月明細</p>'+s+
    '<div class="legend"><span><i class="sw" style="background:var(--c-tuition)"></i>學費</span><span><i class="sw" style="background:var(--c-cram)"></i>補習費</span><span><i class="sw" style="background:var(--c-other)"></i>其他</span></div>'+cd+'</section>';
}

function viewDetail(){

    (S.fKid==='all'||r.childId===S.fKid)&&

function viewYear(){
  if(!S.children.length)return emptyKids();
  const y=S.year,nowY=todayStr().slice(0,4);
  const recs=S.kr.filter(r=>r.date.slice(0,4)===y&&(S.yKid==='all'||r.childId===S.yKid));
  const tu=sum(recs,r=>groupOf(r.category)==='tuition'),cr=sum(recs,r=>groupOf(r.category)==='cram'),tot=sum(recs,()=>true),tl=sum(recs,r=>groupOf(r.category)==='talent'),ot=tot-tu-cr-tl;
  const paid=sum(recs,r=>r.status==='paid'),unp=tot-paid;
  const months=y===nowY?(+todayStr().slice(5,7)):12;
  const kidSel='<select data-filter="yKid">'+[['all','全部孩子']].concat(S.children.map(c=>[c.id,c.name])).map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===S.yKid?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';

  let h='<section class="sec"><div class="monthnav"><button class="iconbtn" data-action="yprev" aria-label="前一年">‹</button><h2>'+y+' 年度</h2><button class="iconbtn" data-action="ynext" aria-label="後一年">›</button></div>'+
    '<div class="filters" style="grid-template-columns:1fr"><div><label>孩子</label>'+kidSel+'</div></div>'+
    '<div class="split" style="margin-top:8px"><div><span class="lbl"><i class="sw" style="background:var(--c-tuition)"></i>學費</span><span class="num"><small>NT$</small>'+num(tu)+'</span></div>'+
    '<div><span class="lbl"><i class="sw" style="background:var(--c-cram)"></i>補習費</span><span class="num"><small>NT$</small>'+num(cr)+'</span></div></div>'+
    '<div class="tally muted"><span>才藝課</span><b>'+money(tl)+'</b></div>'+
    '<div class="tally muted"><span>教材、餐點交通等其他</span><b>'+money(ot)+'</b></div>'+
    '<div class="tally big"><span>全年合計</span><b>'+money(tot)+'</b></div>'+
    (unp>0?'<div class="tally muted"><span>待繳</span><b>'+money(unp)+'</b></div>':'')+
    '<div class="tally muted"><span>平均每月（'+months+' 個月）</span><b>'+money(tot/months)+'</b></div>'+
    (y===nowY?'':'<button class="linkbtn" data-action="thisyear">回到今年</button>')+'</section>';

  // monthly table
  const rows=[];
  for(let m=1;m<=12;m++){
    const key=y+'-'+pad(m),rs=recs.filter(r=>ymOf(r.date)===key);
    const a=sum(rs,r=>groupOf(r.category)==='tuition'),b=sum(rs,r=>groupOf(r.category)==='cram'),t=sum(rs,()=>true);
    const c=sum(rs,x=>groupOf(x.category)==='talent');rows.push({key:key,m:m,a:a,b:b,c:c,o:t-a-b-c,t:t});
  }
  const cell=v=>v?num(v):'<span class="z">–</span>';
  h+='<section class="sec"><div class="sec-head"><h2>每月明細</h2><span class="meta">單位：NT$・點月份看各孩子</span></div><div class="ytable">'+
    '<div class="yr yh"><span>月份</span><span><i style="background:var(--c-tuition)"></i>學費</span><span><i style="background:var(--c-cram)"></i>補習費</span><span><i style="background:var(--c-talent)"></i>才藝課</span><span><i style="background:var(--c-other)"></i>其他</span><span>合計</span></div>';
  const kidsShown=S.yKid==='all'?S.children:S.children.filter(c=>c.id===S.yKid);
  rows.forEach(r=>{
    const open=S.yOpen===r.key;
    const act=r.t?'toggle-month':'goto-month';
    h+='<button class="yr'+(r.key===todayStr().slice(0,7)?' now':'')+'" data-action="'+act+'" data-month="'+r.key+'" aria-expanded="'+(r.t?open:'false')+'"><span>'+r.m+' 月'+(r.t?' <span class="ar">'+(open?'▾':'▸')+'</span>':'')+'</span><span>'+cell(r.a)+'</span><span>'+cell(r.b)+'</span><span>'+cell(r.c)+'</span><span>'+cell(r.o)+'</span><b>'+cell(r.t)+'</b></button>';
    if(open&&r.t){
      h+='<div class="kidbox">';
      kidsShown.forEach(c=>{
        const rs=recs.filter(x=>ymOf(x.date)===r.key&&x.childId===c.id);
        if(!rs.length)return;
        const a=sum(rs,x=>groupOf(x.category)==='tuition'),b=sum(rs,x=>groupOf(x.category)==='cram'),tk=sum(rs,x=>groupOf(x.category)==='talent'),t=sum(rs,()=>true);
        h+='<div class="yr sub" style="--kid:'+esc(c.color)+'"><span><i class="cv"></i>'+esc(c.name)+'</span><span>'+cell(a)+'</span><span>'+cell(b)+'</span><span>'+cell(tk)+'</span><span>'+cell(t-a-b-tk)+'</span><b>'+cell(t)+'</b></div>';
      });
      h+='<button class="golink" data-action="goto-month" data-month="'+r.key+'">查看 '+r.m+' 月每一筆明細 ›</button></div>';
    }
  });
  h+='<div class="yr yf"><span>全年</span><span>'+num(tu)+'</span><span>'+num(cr)+'</span><span>'+num(tl)+'</span><span>'+num(ot)+'</span><span>'+num(tot)+'</span></div></div></section>';

  // 12-month chart
  const max=Math.max(1,...rows.map(r=>r.t));
  const W=320,H=150,pb=22,pt=8,bw=18,gap=(W-12*bw)/13,ph=H-pb-pt;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="全年每月支出">';
  s+='<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" style="stroke:var(--edge)" stroke-width="1.5"/>';
  const shortN=n=>n>=10000?(n/10000).toFixed(1).replace(/\.0$/,'')+'萬':num(n);
  rows.forEach((r,i)=>{
    const x=gap+i*(bw+gap),on=S.yChart===r.key;let yy=H-pb;
    s+='<g role="button" tabindex="0" data-action="toggle-chart" data-month="'+r.key+'" aria-label="'+r.m+' 月，合計 '+num(r.t)+' 元，點一下看明細" aria-pressed="'+on+'" style="cursor:pointer">';
    s+='<rect x="'+(x-gap/2).toFixed(1)+'" y="0" width="'+(bw+gap).toFixed(1)+'" height="'+H+'" style="fill:'+(on?'var(--field)':'transparent')+'"/>';
    [['a','tuition'],['b','cram'],['c','talent'],['o','other']].forEach(p=>{const hh=r[p[0]]/max*ph;if(hh>0){yy-=hh;s+='<rect x="'+x.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" style="fill:var(--c-'+p[1]+')"/>'}});

      cd+='<button class="row" data-action="edit-rec" data-id="'+esc(r.id)+'" style="--kid:'+esc(k.color)+'"><span class="d">'+mdLabel(r.date)+'</span>'+
        '<span class="main"><b>'+esc(r.title)+'</b><small>'+esc(k.name)+'・<i class="catdot" style="--cc:var(--c-'+cat.id+')"></i>'+cat.name+(r.org?'・'+esc(r.org):'')+'</small>'+
        (payerLabel(r)?'<small>'+payerLabel(r)+'</small>':'')+'</span>'+
        '<span class="amt">'+money(r.amount)+statusTag(r)+'</span></button>';
    });
    cd+='</div>';
  }
  h+='<section class="sec chart"><div class="sec-head"><h2>全年走勢</h2><span class="meta">點長條看該月明細</span></div>'+s+
    '<div class="legend"><span><i class="sw" style="background:var(--c-tuition)"></i>學費</span><span><i class="sw" style="background:var(--c-cram)"></i>補習費</span><span><i class="sw" style="background:var(--c-talent)"></i>才藝課</span><span><i class="sw" style="background:var(--c-other)"></i>其他</span></div>'+cd+'</section>';

  // categories
  h+='<section class="sec"><div class="sec-head"><h2>各類別全年</h2><span class="meta">點類別看明細</span></div>';
  CATS.forEach(c=>{
    const list=recs.filter(r=>r.category===c.id),v=sum(list,()=>true),on=S.yCat===c.id&&list.length>0;

/* ---------- 統一發票 QR Code 掃描 ---------- */
function twInvoiceParse(text){
  // 格式已對照實際電子發票證明聯的 QR Code 內容驗證：固定寬度表頭（不是冒號分隔），
  // 表頭後面接一段星號填充，再接商品資訊（用冒號分隔，從尾端配對「品名:數量:單價」）。
  const out={raw:text,ok:false,items:[]};
  if(!text||text.length<53)return out;
  out.track=text.slice(0,2);
  out.invoiceNo=text.slice(2,10);
  const roc=text.slice(10,17),m=roc.match(/^(\d{2,3})(\d{2})(\d{2})$/);
  if(m)out.date=(+m[1]+1911)+'-'+pad(+m[2])+'-'+pad(+m[3]);
  out.random=text.slice(17,21);
  const hex=v=>{const n=parseInt(v,16);return isFinite(n)?n:null};
  out.sales=hex(text.slice(21,29));
  out.total=hex(text.slice(29,37));
  out.buyerId=text.slice(37,45);
  out.sellerId=text.slice(45,53);
  const starM=text.slice(53).match(/\*+/);
  if(starM){
    const tail=text.slice(53+starM.index+starM[0].length);
    const toks=tail.split(':').filter(x=>x!=='');
    const isNum=v=>v!==''&&!isNaN(Number(v));
    let i=toks.length;
    while(i>=3){
      const price=toks[i-1],qty=toks[i-2];
      let name=toks[i-3];
      if(isNum(price)&&isNum(qty)&&!isNum(name)&&name.trim()){
        let dn=name;try{const d=decodeURIComponent(name);if(d)dn=d}catch(e){}
        out.items.unshift({name:dn,qty:Number(qty),price:Number(price)});
        i-=3;
      }else break;
    }
  }
  out.ok=!!(out.invoiceNo&&out.date);
  return out;
}
function invMerge(a,b){
  if(!a)return b;if(!b)return a;
  const o=Object.assign({},a);
  if(b.items&&b.items.length>o.items.length)o.items=b.items;
  ['date','invoiceNo','sales','total','sellerId','buyerId'].forEach(k=>{if(!o[k]&&b[k])o[k]=b[k]});
  o.ok=o.ok||b.ok;
  return o;
}
async function decodeInvoiceImage(fileOrBlob){
  if(!window.QrScanner)throw new Error('QR 掃描工具還沒載入，請稍等一下再試');
  try{QrScanner.WORKER_PATH='https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner-worker.min.js'}catch(e){}
  const res=await QrScanner.scanImage(fileOrBlob,{returnDetailedScanResult:true}).catch(()=>QrScanner.scanImage(fileOrBlob));
  const text=typeof res==='string'?res:(res&&res.data)||'';
  if(!text)return null;
  return twInvoiceParse(text);
}
function loadImageFromFile(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{resolve(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('無法讀取這張照片'))};
    img.src=url;
  });
}
function cropToBlob(img,sx,sw){
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw));c.height=img.naturalHeight||img.height;
  const ctx=c.getContext('2d');
  ctx.drawImage(img,sx,0,sw,c.height,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(b=>res(b),'image/png'));
}
async function decodeInvoicePhoto(file){
  let img;
  try{img=await loadImageFromFile(file)}catch(e){throw new Error('無法讀取這張照片，請重新選擇')}
  const w=img.naturalWidth||img.width;
  const regions=[
    {sx:0,sw:w},                    // 整張
    {sx:0,sw:Math.ceil(w*0.58)},    // 左半（含一點重疊）
    {sx:Math.floor(w*0.42),sw:w-Math.floor(w*0.42)} // 右半
  ];
  let merged=null,found=0;
  for(const r of regions){
    try{
      const blob=await cropToBlob(img,r.sx,r.sw);
      const parsed=await decodeInvoiceImage(blob);
      if(parsed){found++;merged=invMerge(merged,parsed)}
    }catch(e){/* 這個區域沒讀到，繼續試下一個 */}
  }
  if(!found)throw new Error('這張照片裡沒有偵測到 QR Code，請拍近一點、對準、避免反光後再試');
  return merged;
}
function invItemsText(items){
  if(!items||!items.length)return '';
  return items.map(it=>it.name+(it.qty!=null?' x'+it.qty:'')+(it.price!=null?'　NT$'+it.price:'')).join('\n');
}

          '<p class="meta" style="margin:0 0 2px">日期：'+esc(d.date?d.date.replace(/-/g,'/'):'—')+(d.time?'　時間：'+esc(d.time):'')+'</p>'+
          '<p class="meta" style="margin:0 0 2px">付款方式：'+esc(d.method||'—')+(d.cardLast4?'　卡號末4碼：'+esc(d.cardLast4):'')+'</p>'+
          '<p class="hint" style="margin:6px 0 0">AI 辨識可能有誤，下一步記得核對金額和日期。</p>';

      }
    };
    const scanInv=async()=>{
      const file=f1.files&&f1.files[0];
      if(!file)return;
      status.textContent='解析中…（會試著讀照片裡左右兩邊的 QR Code）';
      try{
        const r=await decodeInvoicePhoto(file);
        data=invMerge(data,r);
        status.textContent=(data.ok&&data.items.length)?'已讀到發票資訊和商品明細。':data.ok?'已讀到發票資訊，沒有讀到商品明細（可能照片裡沒拍到，或只有一個 QR Code）。':'讀到 QR Code 了，但格式看起來不太一樣，請檢查下面的欄位或手動輸入。';
      }catch(e){
        status.textContent=e.message||'解析失敗，請重拍一張清楚、對焦準的照片。';
      }
      render();
    };
    const scanNotif=async()=>{
      const file=f2.files&&f2.files[0];
      if(!file)return;
      status.textContent='AI 辨識中…（約幾秒到 1 分鐘）';
      next.disabled=true;
      try{
        ndata=await scanNotifImage(file);
        status.textContent=(ndata.merchant||ndata.amount)?'辨識完成，請核對下面的內容。':'讀不太出來，麻煩手動輸入，或換一張更清楚的截圖。';
      }catch(e){
        status.textContent=e.message||'辨識失敗，請再試一次。';
      }
      render();
    };
    f1.addEventListener('change',scanInv);
    f2.addEventListener('change',scanNotif);
    (async()=>{
      let ok=false;
      try{
        const s=(typeof claude!=='undefined'&&claude&&typeof claude.use==='function')?await claude.use('sample').catch(()=>null):null;
        if(s){const lim=await s.limits().catch(()=>null);ok=!!(lim&&lim.images)}
      }catch(e){}
      if(!ok){
        const radio=$('#iv-notif-radio',sh);
        if(radio){radio.disabled=true;$('#iv-notif-chip',sh).style.opacity='.5';$('#iv-notif-unavail',sh).hidden=false;if(mode==='notif')setMode('inv')}
      }
    })();
    next.addEventListener('click',()=>{
      closeSheet();
      if(mode==='inv'){
        const its=invItemsText(data.items);
        const title=(data.items&&data.items[0])?data.items[0].name+(data.items.length>1?' 等 '+data.items.length+' 項':''):(data.invoiceNo?'發票 '+data.invoiceNo:'發票消費');
        openRecordSheet(null,'family',{
          title:title,amount:data.total||'',date:data.date||todayStr(),org:data.sellerId||'',
          einvoiceNo:(data.track||'')+(data.invoiceNo||''),
          note:[data.invoiceNo?'發票號碼 '+data.invoiceNo:'',its].filter(Boolean).join('\n')
        });
      }else{
        openRecordSheet(null,'family',{
          title:ndata.merchant||'消費',amount:ndata.amount||'',date:ndata.date||todayStr(),
          note:['AI 由通知截圖辨識',ndata.method?'付款方式：'+ndata.method:'',ndata.cardLast4?'卡號末4碼：'+ndata.cardLast4:'',ndata.time?'時間：'+ndata.time:''].filter(Boolean).join('\n')
        });
      }
    });
  });
}

function futureSection(){
  const today=todayStr(),lim=addMonthsDate(today,12),items=[];
  S.family.forEach(r=>{
    if(r.status!=='unpaid')return;
    const due=r.dueDate||r.date;
    if(daysBetween(today,due)>7&&due<=lim){
      const cat=fcatOf(r.category);
      const tag=r.advance?(r.recur?'🏢 代墊・每月固定':'🏢 代墊'):(r.recur?'每月固定':'待繳');
      items.push({due:due,tag:tag,title:r.title,sub:cat.name+(r.org?'・'+r.org:''),amount:+r.amount||0,id:r.id,color:r.advance?'var(--f-wife)':'var(--f-'+cat.id+')'});
    }
  });
  polSchedule().out.forEach(e=>{
    if(e.rec||e.due<today||e.due>lim)return;
    items.push({due:e.due,tag:'保費',title:e.p.name+' 保費',sub:[e.p.insured,e.p.insurer].filter(Boolean).join('・')||'保險',amount:+e.p.premium||0,id:'',color:'var(--f-insurance)'});
  });
  cfBills().filter(g=>!g.paid&&g.payable>0&&daysBetween(today,g.due)>7&&g.due<=lim).forEach(g=>{
    const advSum=(g.items||[]).filter(it=>it.kind==='rec'&&it.r.advance&&it.r.status==='unpaid').reduce((a,it)=>a+it.amount,0);
    const rem=g.payable-advSum;
    if(rem<=0)return;
    items.push({due:g.due,tag:'信用卡',title:g.name+' 帳款',sub:'共 '+g.n+' 筆'+(advSum>0?'（已扣掉承益代墊 '+money(advSum)+'）':'')+(g.creditApplied>0?'・已抵用前期溢繳 '+money(g.creditApplied):''),amount:rem,id:'',color:'var(--f-daily)'});
  });
  items.sort((a,b)=>a.due.localeCompare(b.due)||String(a.title).localeCompare(String(b.title)));
  const total=items.reduce((a,x)=>a+x.amount,0);
  let h='<section class="sec"><div class="sec-head"><h2>未來週期性待繳項目</h2><span class="meta">12 個月內・'+items.length+' 筆・'+money(total)+'</span></div>';
  if(!items.length)return h+'<p class="note" style="margin:0">目前沒有。記支出時選「每月固定的費用」，或到「保險管理」新增保單，未來要繳的款項就會列在這裡。</p></section>';
  h+='<p class="meta" style="margin:0 0 4px">包含每月固定的待繳費用（電話費、瓦斯費等）、可跟承益請款的代墊項目（標🏢）、保險保費，以及信用卡帳款（已扣掉代墊部分）；一週內要繳的在上方顯示。</p>';
  let last='';
  items.forEach(x=>{
    const ym=x.due.slice(0,7);
    if(ym!==last){
      last=ym;
      const grp=items.filter(y=>y.due.slice(0,7)===ym),q=ym.split('-');
      h+='<div class="mhead"><span>'+q[0]+' 年 '+(+q[1])+' 月</span><span>'+money(grp.reduce((a,y)=>a+y.amount,0))+'・'+grp.length+' 筆</span></div>';
    }
    const inner='<span class="d">'+mdLabel(x.due)+'</span><span class="main"><b>'+esc(x.title)+'</b><small>'+x.tag+'・'+esc(x.sub)+'</small></span><span class="amt">'+money(x.amount)+'</span>';
    h+=x.id&&S.canWrite?'<button class="row" data-action="edit-rec" data-id="'+esc(x.id)+'" style="--kid:'+x.color+'">'+inner+'</button>':'<div class="row" style="--kid:'+x.color+'">'+inner+'</div>';
  });
  return h+'</section>';
}

  if(!S.fr.length){

    pend.slice(0,6).forEach(r=>{

        '<div class="right"><b>'+money(r.amount)+'</b>'+dueTag(due)+(S.canWrite?'<br><button class="paybtn" data-action="mark-paid" data-id="'+esc(r.id)+'">標為已繳</button>':'')+'</div></div>';
    });
    const moreF=pendAll.length-Math.min(pend.length,6);
    if(moreF>0)h+='<p class="note">另有 '+moreF+' 筆待繳（含一週後才到期的），到期前一週會顯示在這裡。</p>';

      h+='<div class="row" style="--kid:var(--f-daily)"><span class="d">'+mdLabel(x.due)+'</span><span class="main"><b>'+esc(x.tool||'未命名工具')+'</b><small>'+(x.close?'結帳日 '+mdLabel(x.close)+'・':'')+x.n+' 筆</small>'+(Object.keys(x.via).length?'<small>含 '+Object.keys(x.via).map(k=>esc(k)+' 加值 '+money(x.via[k])).join('、')+'</small>':'')+(x.acct?'<small>'+esc(x.acct)+'</small>':'')+'</span><span class="amt">'+money(x.v)+'<br><span class="stamp '+(d<=7?'soon':'wait')+'">'+(d===0?'今天':d+' 天後')+'</span></span></div>';

    h+='</section>';
  }

  // categories
  const leaf=FCATS.map(c=>({c:c,v:sum(recs,r=>r.category===c.id),n:recs.filter(r=>r.category===c.id).length})).filter(x=>x.n);
  const by=[],usedC={};

  by.sort((a,b)=>b.v-a.v);
  h+='<section class="sec"><div class="sec-head"><h2>各類別</h2><span class="meta">'+(+ym.split('-')[1])+' 月・點類別篩選明細</span></div>';

  h+='<section class="sec"><div class="sec-head"><h2>本月明細</h2><span class="meta">'+list.length+' 筆・'+money(sum(list,()=>true))+'</span></div>';
  if(S.faCat)h+='<button class="linkbtn" data-action="toggle-facat" data-cat="'+S.faCat+'">只看「'+famSelName(S.faCat)+'」，點此顯示全部 ✕</button>';
  if(!list.length)h+='<p class="note">沒有符合的紀錄。</p>';
  list.forEach(r=>{h+=famRow(r)});
  h+='</section>';

  h+=famAdvSection(ym);

  // trend
  const months=[];for(let i=5;i>=0;i--)months.push(addMonths(S.faEnd||ym,-i));
  const vals=months.map(m=>sum(S.fr,r=>ymOf(r.date)===m));
  const max=Math.max(1,...vals,S.budget||0);
  const W=320,H=150,pb=22,pt=18,bw=32,gap=(W-6*bw)/7,ph=H-pb-pt;

    sv+='<rect x="'+(x-gap/2).toFixed(1)+'" y="0" width="'+(bw+gap).toFixed(1)+'" height="'+H+'" style="fill:'+(on?'var(--field)':'transparent')+'"/>';
    if(hh>0)sv+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+hh.toFixed(1)+'" style="fill:var(--brand)"/>';
    if(vals[i]>0)sv+='<text'+(on?' class="cur"':'')+' x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" style="font-size:9px">'+short(vals[i])+'</text>';
    sv+='<text class="'+(m===ym||on?'cur':'')+'" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+(+m.split('-')[1])+'月</text></g>';
  });
  if(S.budget>0){const by2=H-pb-S.budget/max*ph;sv+='<line x1="0" x2="'+W+'" y1="'+by2.toFixed(1)+'" y2="'+by2.toFixed(1)+'" style="stroke:var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/>'}
  sv+='</svg>';
  let fd='';
  const selIdx=months.indexOf(S.faChart);
  if(selIdx>=0){
    const list=S.fr.filter(r=>ymOf(r.date)===S.faChart).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
    const q=S.faChart.split('-');
    fd='<div class="statdetail" id="stat-detail-fchart"><p class="meta pnote" style="margin:0 0 4px"><b>'+q[0]+' 年 '+(+q[1])+' 月</b>　'+list.length+' 筆・'+money(vals[selIdx])+'，點一筆可查看或修改</p>';
    if(!list.length)fd+='<p class="note">這個月沒有紀錄。</p>';
    list.forEach(r=>{fd+=famRow(r)});
    fd+='<button class="linkbtn" data-action="fam-goto" data-month="'+S.faChart+'">到該月的家庭支出頁 ›</button></div>';
  }
  const fm0=months[0].split('-'),fm5=months[5].split('-');
  const frange=fm0[0]+' 年 '+(+fm0[1])+' 月 – '+(fm0[0]===fm5[0]?'':fm5[0]+' 年 ')+(+fm5[1])+' 月';
  const fnav='<div class="monthnav"><button class="iconbtn" data-action="fpre" aria-label="往前一個月">‹</button><div style="text-align:center"><h2>近六個月</h2><span class="meta">'+frange+'</span></div><button class="iconbtn" data-action="fpost" aria-label="往後一個月">›</button></div>'+
    (S.faEnd&&S.faEnd!==ym?'<button class="linkbtn" data-action="freset" style="margin:-4px 0 4px">回到目前月份</button>':'')+
    '<p class="meta" style="margin:0 0 4px;text-align:center">'+(S.budget>0?'虛線為每月預算・':'')+'點長條看該月明細</p>';
  h+='<section class="sec fbar">'+fnav+sv+fd+'</section>';
  h+=futureSection();
  return h;
}
const FDAILY=['breakfast','lunch','dinner','eatout','food','daily','transport','medical','wife','weirong','weitang','famother'];
const FT_ALL={set:'all',ids:null,title:'每月統計表',nav:false,budget:true,allLabel:'全部類別'};
const FT_DAILY={set:'daily',ids:FDAILY,title:'日常開銷統計表',nav:true,budget:false,allLabel:'日常開銷合計'};
const famCatKey=c=>FCATS.some(x=>x.id===c)?c:'famother';
function famYearStats(y,ids){
  const rows=FCATS.filter(c=>!ids||ids.indexOf(c.id)>=0).map(c=>({c:c,m:new Array(12).fill(0),t:0}));
  const tot=new Array(12).fill(0);
  S.fr.filter(r=>r.date.slice(0,4)===y).forEach(r=>{
    const row=rows.find(x=>x.c.id===famCatKey(r.category));
    if(!row)return;
    const mi=+r.date.slice(5,7)-1,v=+r.amount||0;
    row.m[mi]+=v;row.t+=v;tot[mi]+=v;
  });
  return {rows:rows.filter(x=>x.t>0),tot:tot,all:tot.reduce((a,b)=>a+b,0)};
}

const ICATS=[{id:'life',name:'壽險'},{id:'medical',name:'醫療險'},{id:'accident',name:'意外險'},{id:'critical',name:'重大傷病／癌症險'},{id:'annuity',name:'年金／儲蓄險'},{id:'care',name:'長照／失能險'},{id:'car',name:'車險'},{id:'home',name:'住宅火險'},{id:'iother',name:'其他'}];
const FREQ={monthly:{n:'月繳',m:1},quarterly:{n:'季繳',m:3},semiannual:{n:'半年繳',m:6},annual:{n:'年繳',m:12},single:{n:'躉繳',m:0}};
const icatName=id=>(ICATS.find(c=>c.id===id)||ICATS[ICATS.length-1]).name;
function safeUrl(u){
  u=String(u||'').trim();if(!u)return '';
  if(!/^[a-z][a-z0-9+.\-]*:/i.test(u))u='https://'+u;
  try{const x=new URL(u);return (x.protocol==='https:'||x.protocol==='http:')?x.href:''}catch(e){return ''}
}
function addDaysStr(ds,n){const q=ds.split('-').map(Number);const t=new Date(q[0],q[1]-1,q[2]+n);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
const polFreq=p=>FREQ[p.freq]||FREQ.annual;
const usdMoney=v=>'US$'+Math.round(+v||0).toLocaleString('en-US');
const polMoney=(p,v)=>p.currency==='usd'?usdMoney(v):money(v);
function polAnnual(p){const fm=polFreq(p).m;return fm?(+p.premium||0)*12/fm:0}
function polPayments(p){return S.family.filter(r=>r.policyId===p.id).sort((a,b)=>b.date.localeCompare(a.date))}
function polDue(p){
  if(p.status==='ended'||!p.startDate)return null;
  const fm=polFreq(p).m,start=p.startDate,today=todayStr(),lim=addDaysStr(today,-14);
  const rec={};S.family.forEach(r=>{if(r.policyId===p.id&&r.policyDue)rec[r.policyDue]=1});
  if(fm===0)return (rec[start]||start<lim)?null:{due:start,late:start<today};
  const end=p.payYears>0?addMonthsDate(start,p.payYears*12):null;
  for(let k=0;k<1500;k++){
    const d=addMonthsDate(start,k*fm);
    if(end&&d>=end)return null;
    if(d<lim||rec[d])continue;
    return {due:d,late:d<today};
  }
  return null;
}
function polProgress(p){
  if(polFreq(p).m===0)return '躉繳（一次繳清）';
  if(p.renewAnnual)return '每年續約';
  if(!(p.payYears>0)||!p.startDate)return '';
  const q=p.startDate.split('-').map(Number),t=todayStr().split('-').map(Number);
  const months=(t[0]-q[0])*12+(t[1]-q[1])-(t[2]<q[2]?1:0);
  if(months<0)return '尚未生效・繳費 '+p.payYears+' 年';
  if(months>=p.payYears*12)return '繳費 '+p.payYears+' 年已期滿';
  return '繳費第 '+(Math.floor(months/12)+1)+' / '+p.payYears+' 年';
}

function polMatches(){

function polSchedule(){
  const today=todayStr(),nowYm0=today.slice(0,7),from=addMonths(nowYm0,-3)+'-01',to=addDaysStr(addMonths(nowYm0,13)+'-01',-1),out=[];
  S.policies.forEach(p=>{
    if(p.status==='ended'||!p.startDate)return;
    const fm=polFreq(p).m,rec={};
    S.family.forEach(r=>{if(r.policyId===p.id&&r.policyDue)rec[r.policyDue]=r});
    const push=d=>{if(d>=from&&d<=to)out.push({p:p,due:d,rec:rec[d]||null})};
    if(fm===0){push(p.startDate);return}
    const end=p.payYears>0?addMonthsDate(p.startDate,p.payYears*12):null;
    const q=p.startDate.split('-').map(Number),f=from.split('-').map(Number);
    const k0=Math.max(0,Math.floor(((f[0]-q[0])*12+(f[1]-q[1]))/fm)-1);
    for(let k=k0;k<k0+400;k++){
      const d=addMonthsDate(p.startDate,k*fm);
      if(d>to)break;
      if(end&&d>=end)break;
      push(d);
    }
  });
  out.sort((a,b)=>a.due.localeCompare(b.due)||String(a.p.name).localeCompare(String(b.p.name)));
  return {out:out,from:from,to:to};
}

  const ymd=d=>{const q=d.split('-');return q[0]+' 年 '+(+q[1])+' 月'};
  let h='<section class="sec"><div class="sec-head"><h2>繳費時程表</h2><span class="meta">'+ymd(sc.from)+' – '+ymd(sc.to)+'</span></div>';
  if(!out.length)return h+'<p class="note" style="margin:0">'+(hidden?'這段期間的保費都已記錄繳費，沒有待處理的項目。（已隱藏 '+hidden+' 筆）':'這段期間沒有需要繳的保費。')+'</p></section>';
  h+='<div class="tally muted" style="padding-top:0"><span>尚未繳費（'+out.length+' 筆）</span><b>'+money(tot(out))+'</b></div>'+
    '<div class="tally muted"><span>今天起未來 12 個月（'+fut.length+' 筆）</span><b>'+money(tot(fut))+'</b></div>'+
    (hidden?'<div class="tally muted"><span>已記錄繳費（已隱藏）</span><b>'+hidden+' 筆</b></div>':'');
  let last='';
  out.forEach(e=>{
    const ym=e.due.slice(0,7),p=e.p;
    if(ym!==last){
      last=ym;
      const grp=out.filter(x=>x.due.slice(0,7)===ym);
      h+='<div class="mhead"><span>'+ymd(ym+'-01')+(ym===nowYm?'（本月）':'')+'</span><span>'+money(tot(grp))+'・'+grp.length+' 筆</span></div>';
    }
    h+=schedRow(e,today);
  });
  return h+'</section>';
}

function insKeyOf(p){const by=S.insStatBy;return by==='insured'?(p.insured||'未填寫'):by==='type'?icatName(p.type):p.id}
function insStatData(){
  const nowYm=todayStr().slice(0,7),months=[];
  for(let i=-3;i<=12;i++)months.push(addMonths(nowYm,i));
  const by=S.insStatBy,sc=polSchedule();
  const keyOf=insKeyOf;
  const rows={},order=[],tot={},paid={};
  months.forEach(m=>{tot[m]=0;paid[m]=0});
  sc.out.forEach(e=>{
    const k=keyOf(e.p),m=e.due.slice(0,7),v=+e.p.premium||0;
    if(!rows[k]){rows[k]={key:k,label:by==='policy'?e.p.name:k,sub:by==='policy'?(e.p.insured||''):'',m:{},t:0};order.push(k)}
    rows[k].m[m]=(rows[k].m[m]||0)+v;rows[k].t+=v;
    if(tot[m]!==undefined){tot[m]+=v;if(e.rec)paid[m]+=(+e.rec.amount||0)}
  });
  order.sort((a,b)=>rows[b].t-rows[a].t);
  return {months:months,rows:order.map(k=>rows[k]),tot:tot,paid:paid,all:months.reduce((a,m)=>a+tot[m],0),paidAll:months.reduce((a,m)=>a+paid[m],0),nowYm:nowYm};
}

  if(sel){
    const today=todayStr(),lbl=sel.r==='*'?'全部':((st.rows.find(x=>x.key===sel.r)||{}).label||sel.r);

    h+='<div class="statdetail" id="stat-detail"><div class="sec-head"><h2 style="font-size:16px">'+esc(lbl)+'・'+(sel.m==='*'?'整段期間':q[0]+' 年 '+(+q[1])+' 月')+'</h2><button class="linkbtn" data-action="ins-cell-clear">收起 ✕</button></div><p class="meta pnote" style="margin:0 0 4px">'+list.length+' 筆・'+money(list.reduce((a,e)=>a+(+e.p.premium||0),0))+'</p>';

  if(S.dl)h+='<div class="btnrow"><button class="btn" data-action="ins-export">匯出統計表（CSV）</button></div>';

async function exportInsTable(){
  if(!S.dl)return;
  const st=insStatData();
  if(!st.rows.length){toast('沒有資料可以匯出');return}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=[S.insStatBy==='policy'?'保單':S.insStatBy==='insured'?'被保險人':'險種'].concat(st.months.map(m=>m),['合計']);
  const rows=[head];
  st.rows.forEach(r=>rows.push([r.label].concat(st.months.map(m=>r.m[m]||0),[r.t])));
  rows.push(['月合計'].concat(st.months.map(m=>st.tot[m]),[st.all]));
  rows.push(['已記錄繳費'].concat(st.months.map(m=>st.paid[m]),[st.paidAll]));
  const csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  try{await S.dl.save({filename:'insurance-premium-'+todayStr()+'.csv',data:csv});toast('已匯出')}
  catch(e){if(!e||e.code!=='declined')toast('無法匯出檔案')}
}

        createdBy:isNew?me:(p.createdBy||me),createdAt:isNew?Date.now():(p.createdAt||Date.now()),updatedBy:me,updatedAt:Date.now()

}

function viewMajor(){
  const all=S.family.filter(r=>r.major&&!r.advance).concat(S.records.filter(r=>r.major));
  const years=[];all.forEach(r=>{const y=r.date.slice(0,4);if(years.indexOf(y)<0)years.push(y)});
  years.sort().reverse();
  if(S.mYear!=='all'&&years.indexOf(S.mYear)<0)S.mYear='all';
  const list=all.filter(r=>S.mYear==='all'||r.date.slice(0,4)===S.mYear).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  const tot=sum(list,()=>true);
  let h='<section class="sec"><div class="famtotal"><span class="lbl">'+(S.mYear==='all'?'全部年度':S.mYear+' 年')+'的重大事件支出</span><span class="num"><small>NT$</small>'+num(tot)+'</span></div>'+
    '<div class="tally muted"><span>事件筆數</span><b>'+list.length+' 筆</b></div>'+
    (S.canWrite?'<div class="btnrow"><button class="btn primary" data-action="add-maj">＋ 記重大事件</button></div>':'')+'</section>';
  if(!all.length){
    return h+'<section class="sec empty"><h2>還沒有重大事件</h2><p>在「家庭支出」或「增加小孩學雜費」記帳時勾選「⭐ 重大事件」（例如買房、結婚、生產、大型醫療、入學、升學），就會集中顯示在這裡，方便回頭檢視。</p></section>';
  }
  const ytot=years.map(y=>({y:y,v:sum(all,r=>r.date.slice(0,4)===y),n:all.filter(r=>r.date.slice(0,4)===y).length}));
  const mx=Math.max(1,...ytot.map(x=>x.v));
  h+='<section class="sec"><div class="sec-head"><h2>各年度</h2><span class="meta">點年度篩選，再點取消</span></div>';
  ytot.forEach(x=>{
    const on=S.mYear===x.y;
    h+='<button class="catln catbtn wide'+(on?' on':'')+'" data-action="major-year" data-year="'+x.y+'" aria-pressed="'+on+'"><span>'+x.y+' 年（'+x.n+'）</span><span class="bar"><i style="width:'+Math.round(x.v/mx*100)+'%;background:var(--warn)"></i></span><b>'+money(x.v)+'</b></button>';
  });
  h+='</section><section class="sec"><div class="sec-head"><h2>事件明細</h2><span class="meta">點一筆可查看或修改</span></div>';
  let last='';
  list.forEach(r=>{
    const y=r.date.slice(0,4);
    if(y!==last){last=y;h+='<div class="mhead"><span>'+y+' 年</span><span>'+money(sum(list,x=>x.date.slice(0,4)===y))+'</span></div>'}
    h+=r.kind==='family'?famRow(r):kidMajorRow(r);
  });
  return h+'</section>';
}

/* ---------- credit card cash flow ---------- */
function cfBills(){
  const today=todayStr();
  const list=cardBillGroups().filter(g=>g.hasId);
  list.forEach(b=>{
    const st=S.cardState[b.key]||{};
    b.paid=!!st.paid;b.ready=!!st.ready;
    b.paidAmount=(st.paidAmount!==null&&st.paidAmount!==undefined&&st.paidAmount!=='')?+st.paidAmount:null;
    b.paidDate=st.paidDate||'';
    b.by=bizBack(b.due,S.cfBuffer);
    b.acct=toolAcct(b.tool);b.acctId=toolAcctId(b.tool);
    b.dd=daysBetween(today,b.due);b.db=daysBetween(today,b.by);
    b.weekend=[0,6].indexOf(new Date(b.due+'T00:00:00').getDay())>=0;
  });
  const byCard={};
  list.forEach(b=>{(byCard[b.cardId]=byCard[b.cardId]||[]).push(b)});
  Object.keys(byCard).forEach(cid=>{
    let carry=0;
    byCard[cid].sort((x,y)=>x.due.localeCompare(y.due)).forEach(b=>{
      const gross=Math.max(0,b.amount),applied=Math.min(carry,gross);
      b.creditApplied=applied;b.payable=gross-applied;
      let over=0;
      if(b.paid){const actual=b.paidAmount!==null?b.paidAmount:b.payable;over=Math.max(0,actual-b.payable)}
      b.over=over;carry=carry-applied+over;b.carryOut=carry;
    });
  });
  list.forEach(b=>{
    b.credit=b.payable<=0;
    b.state=b.paid?'paid':b.credit?'credit':b.dd<0?'late':b.ready?'ready':b.db<=0?'now':b.db<=7?'soon':'later';
  });
  return list.sort((a,b)=>a.due.localeCompare(b.due)||a.name.localeCompare(b.name));
}
function cfProject(open){
  const today=todayStr(),horizon=addMonthsDate(today,6),res={};
  S.accounts.forEach(a=>{
    const nowBal=acctNow(a),known=(nowBal!==null);
    const evs=[];
    open.forEach(b=>{if(b.acctId===a.id&&b.payable>0)evs.push({date:b.due<today?today:b.due,kind:'out',amount:b.payable,label:b.name+' 付款',bill:b})});
    S.payTools.forEach(t=>{
      if(!isAutoPrepaid(t)||t.topupMode!=='account'||toolAcctId(t)!==a.id)return;
      prepaidSim(t).events.forEach(e=>{
        if(e.date<=today)return;
        evs.push({date:e.date,kind:'out',amount:e.amount,label:t.name+' 自動儲值'});
      });
    });
    payRecs().forEach(r=>{
      if(r.date<=today)return;
      const v=spendOn(r,a.id);
      if(v>0)evs.push({date:r.date,kind:'out',amount:v,label:r.title+'（銀行轉帳）'});
    });
    allFlows(horizon).forEach(f=>{
      if(f.date<=today)return;
      const lbl=flowTitle(f);
      if(f.toId===a.id)evs.push({date:f.date,kind:'in',amount:+f.amount||0,label:lbl});
      if(f.fromId===a.id)evs.push({date:f.date,kind:'out',amount:+f.amount||0,label:lbl});
    });
    const D=+a.inflowDay,A=+a.inflowAmt;
    if(D>=1&&D<=31&&A>0){
      for(let k=0;k<=3;k++){
        const d=dayInMonth(addMonths(today.slice(0,7),k),D);
        if(d>=today&&d<=horizon&&(!a.balanceDate||d>a.balanceDate))evs.push({date:d,kind:'in',amount:A,label:a.inflowLabel||'固定入帳'});
      }
    }
    evs.sort((x,y)=>x.date.localeCompare(y.date)||((x.kind==='in'?0:1)-(y.kind==='in'?0:1)));
    let bal=known?nowBal:null,min=bal,minDate=today,shortDate='';
    evs.forEach(e=>{
      if(bal===null)return;
      bal+=e.kind==='in'?e.amount:-e.amount;
      e.after=bal;
      if(e.bill){e.bill.after=bal;e.bill.enough=bal>=0}
      if(bal<min){min=bal;minDate=e.date}
      if(bal<0&&!shortDate)shortDate=e.date;
    });
    res[a.id]={acct:a,known:known,now:nowBal,events:evs,min:min,minDate:minDate,shortDate:shortDate};
  });
  return res;
}
function cfAdvice(b){
  const by=mdLabel(b.by);
  if(b.paid)return '已繳款';
  if(b.credit)return (b.creditApplied>0&&b.amount>0)?'前期溢繳 '+money(b.creditApplied)+' 已抵用，這期不需要繳款':'這期帳單因退費抵減，不需要繳款（抵減 '+money(-b.amount)+'）';
  if(b.acct){
    if(b.after!==undefined){
      if(b.enough)return (b.ready?'已備款，':'帳戶餘額足夠，')+'付款後預估剩 '+money(b.after)+(b.dd<0?'；請立即繳款':'');
      const need=-b.after;
      return (b.ready?'已標示備款，但預估仍不足：':'')+(b.db<=0?'現在就要':'建議 '+by+' 前')+'把至少 '+money(need)+' 轉入「'+b.acct+'」（付款後預估餘額 −'+num(need)+'）';
    }
    return b.ready?'已備款，等待 '+mdLabel(b.due)+' 代扣':(b.db<=0?'現在就要把至少 '+money(b.payable)+' 存入「'+b.acct+'」':'建議 '+by+' 前把至少 '+money(b.payable)+' 存入「'+b.acct+'」');
  }
  return b.ready?'已備妥款項，記得在 '+mdLabel(b.due)+' 前繳款':(b.db<=0?'現在就要人工繳款 '+money(b.payable):'建議 '+by+' 前人工繳款 '+money(b.payable))+'（尚未設定代扣繳帳戶）';
}
function cfTag(b){
  if(b.state==='paid')return '<span style="color:var(--ok);font-size:12px;font-weight:700">✓ 已繳款'+(b.over>0?'・溢繳 '+money(b.over):'')+'</span>';
  if(b.state==='credit')return '<span style="color:var(--ok);font-size:12px;font-weight:700">'+((b.creditApplied>0&&b.amount>0)?'溢繳抵用':'退費抵減')+'</span>';
  if(b.state==='late')return '<span class="stamp late">逾期未繳 '+(-b.dd)+' 天</span>';
  if(b.state==='ready')return '<span class="stamp paid">已備款</span>';
  if(b.state==='enough')return '<span style="color:var(--ok);font-size:12px;font-weight:700">餘額足夠</span>';
  if(b.state==='now')return '<span class="stamp late">現在要調度</span>';
  if(b.state==='soon')return '<span class="stamp soon">'+b.db+' 天後要調度</span>';
  return '<span style="color:var(--muted);font-size:12px">'+mdLabel(b.by)+' 前備款</span>';
}

    }
    h+=b.isStd?stdSchedRow(b):cfRow(b,true);
  });

  return h;
}

/* ---------- income & account flows ---------- */
function flowTitle(f){
  if(f.virtual)return '約定轉帳：'+f.note+(f.toId?'（'+placeLabel(f.fromId)+' → '+placeLabel(f.toId)+'）':'');
  if(f.type==='income')return (f.source||incCatName(f.category))+' 入帳';
  if(f.type==='reimburse')return '承益企業報銷入帳';
  if(f.type==='transfer')return '轉帳 '+placeLabel(f.fromId)+' → '+placeLabel(f.toId);
  return f.note||'帳戶扣款';
}
function placeBaseDate(id){
  const a=S.accounts.find(x=>x.id===id);
  if(a)return acctNow(a)!==null?(a.balanceDate||''):'';
  const t=S.payTools.find(x=>x.id===id);
  return (t&&prepaidNow(t)!==null)?(t.balanceDate||''):'';
}
function flowLedger(ym,acctId){
  const rows=[];
  allFlows(dayInMonth(ym,31)).filter(f=>ymOf(f.date)===ym).forEach(f=>{
    if(acctId!=='all'&&f.toId!==acctId&&f.fromId!==acctId)return;
    const amt=+f.amount||0;
    const delta=acctId==='all'?((f.type==='income'||f.type==='reimburse')?amt:f.type==='out'?-amt:0):((f.toId===acctId?amt:0)-(f.fromId===acctId?amt:0));
    const inBase=[f.toId,f.fromId].some(id=>id&&placeBaseDate(id)&&f.date<=placeBaseDate(id));
    rows.push({date:f.date,kind:'flow',f:f,delta:delta,amount:amt,inBase:inBase});
  });
  S.accounts.forEach(a=>{
    if(acctId!=='all'&&a.id!==acctId)return;
    acctOutflows(a,'0000-00-00','9999-12-31').forEach(o=>{
      if(ymOf(o.date)!==ym)return;
      rows.push({date:o.date,kind:o.kind,label:o.label,acct:a,delta:-o.amount,amount:o.amount,inBase:!!(a.balanceDate&&o.date<=a.balanceDate)});
    });
  });
  S.accounts.forEach(a=>{
    if(acctId!=='all'&&a.id!==acctId)return;
    const pseudo={id:a.id,name:acctLabel(a),type:'bank',cardNo:''};
    payRecs().forEach(r=>{
      if(ymOf(r.date)!==ym||r.status==='unpaid')return;
      const v=spendOn(r,a.id);
      if(!v)return;
      rows.push({date:r.date,kind:'spend',r:r,tool:pseudo,delta:-v,amount:Math.abs(v),inBase:!!(a.balanceDate&&acctNow(a)!==null&&r.date<=a.balanceDate)});
    });
  });
  S.payTools.forEach(t=>{
    if(HAS_BAL.indexOf(t.type)<0)return;
    if(acctId!=='all'&&t.id!==acctId)return;
    payRecs().forEach(r=>{
      if(ymOf(r.date)!==ym||r.status==='unpaid')return;
      const v=spendOn(r,t.id);
      if(!v)return;
      rows.push({date:r.date,kind:'spend',r:r,tool:t,delta:-v,amount:Math.abs(v),inBase:!!(t.balanceDate&&prepaidNow(t)!==null&&r.date<=t.balanceDate)});
    });
  });
  S.family.forEach(r=>{
    if(r.status!=='unpaid')return;
    const due=r.dueDate||r.date;
    if(ymOf(due)!==ym)return;
    const v=acctId==='all'?(+r.amount||0):spendOn(r,acctId);
    if(v<=0)return;
    rows.push({date:due,kind:'unpaid',r:r,kid:false,delta:-v,amount:v,unpaid:true});
  });
  S.records.forEach(r=>{
    if(r.status!=='unpaid')return;
    const due=r.dueDate||r.date;
    if(ymOf(due)!==ym)return;
    const v=acctId==='all'?(+r.amount||0):spendOn(r,acctId);
    if(v<=0)return;
    rows.push({date:due,kind:'unpaid',r:r,kid:true,delta:-v,amount:v,unpaid:true});
  });
  cfBills().forEach(b=>{
    if(b.paid||b.payable<=0||ymOf(b.due)!==ym)return;
    if(acctId!=='all'&&b.acctId!==acctId)return;
    rows.push({date:b.due,kind:'billunpaid',label:b.name+' 信用卡帳款',delta:-b.payable,amount:b.payable,unpaid:true});
  });
  return rows.sort((x,y)=>y.date.localeCompare(x.date)||(x.kind==='spend'?1:0)-(y.kind==='spend'?1:0));
}
function ledgerRowInfo(x){
  const today=todayStr(),future=x.date>today;
  let title,sub,color,attrs='';
  if(x.kind==='flow'){
    const f=x.f;
    if(f.virtual){
      const so=S.standing.find(z=>z.id===f.standingId)||{};
      title='約定轉帳：'+f.note;sub=(f.toId?placeLabel(f.fromId)+' → '+placeLabel(f.toId):placeLabel(f.fromId)+' → '+(so.toName||'外部'))+'・每月 '+(+so.day||'')+' 號';color='var(--f-utility)';
    }else if(f.type==='income'){
      title=f.source||incCatName(f.category);
      sub=[incCatName(f.category),'入帳：'+placeLabel(f.toId),f.person,f.note].filter(Boolean).join('・');

function flowLedgerRange(from,to,acctId){
  const out=[];
  let ym=from.slice(0,7);const endYm=to.slice(0,7);let n=0;
  while(ym<=endYm&&n<400){
    flowLedger(ym,acctId).forEach(x=>{if(x.date>=from&&x.date<=to)out.push(x)});
    ym=addMonths(ym,1);n++;
  }
  return out;
}
