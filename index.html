/* ---------- standing transfers (約定轉帳) ---------- */
function standingDates(o,upto){
  const start=o.startDate||todayStr();
  if(o.kind==='once')return (start<=upto)?[start]:[];
  const cap=addDaysStr(todayStr(),400),lim0=upto<cap?upto:cap,end=(o.endDate&&o.endDate<lim0)?o.endDate:lim0,day=+o.day||+start.slice(8,10),out=[];
  for(let k=0;k<500;k++){
    const d=dayInMonth(addMonths(start.slice(0,7),k),day);
    if(d>end)break;
    if(d>=start)out.push(d);
  }
  return out;
}
function standingFlows(upto){
  const out=[];
  S.standing.forEach(o=>{
    if(o.active===false)return;
    const skips=o.skips||[];
    standingDates(o,upto).forEach(d=>{
      if(skips.indexOf(d)>=0)return;
      out.push({id:'st:'+o.id+':'+d,type:o.toId?'transfer':'out',date:d,amount:+o.amount||0,fromId:o.fromId||'',toId:o.toId||'',category:'',source:'',person:'',note:o.name||'約定轉帳',standingId:o.id,virtual:true,createdAt:0});
    });
  });
  return out;
}
function allFlows(upto){return S.flows.concat(standingFlows(upto||todayStr()))}
function nextStanding(o){
  if(o.active===false)return null;
  const today=todayStr(),skips=o.skips||[];
  if(o.kind==='once')return (o.startDate&&o.startDate>=today&&skips.indexOf(o.startDate)<0)?o.startDate:null;
  return standingDates(o,addDaysStr(today,400)).find(d=>d>=today&&skips.indexOf(d)<0)||null;
}

function viewCardBills(){

function stmtYm(g){return g.close?g.close.slice(0,7):g.due.slice(0,7)}
function payRel(g){
  const sm=stmtYm(g),dm=g.due.slice(0,7);
  const diff=(+dm.slice(0,4)-+sm.slice(0,4))*12+(+dm.slice(5,7)-+sm.slice(5,7));
  return (diff<=0?'當月':diff===1?'隔月':diff+' 個月後')+' '+(+g.due.slice(8,10))+' 日';
}

    '<div class="tally muted"><span>這個月的帳款要付（'+dueList.length+' 張帳單）</span><b>'+money(tot)+'</b></div>'+
    '<div class="tally muted"><span>其中已繳款</span><b style="color:var(--ok)">'+money(paidTot)+'</b></div>'+(credList.length?'<div class="tally muted"><span>退費抵減（不用繳費）</span><b style="color:var(--ok)">'+credList.length+' 張・'+money(credList.reduce((a,g)=>a+g.amount,0))+'</b></div>':'');

/* ---------- kids lesson packages (才藝堂數) ---------- */
function isTalentRec(r){
  if(r.advance||r.refundOf)return false;
  if(r.kind==='family')return !!(LINK[r.category]&&(r.kidCat==='talent'||r._cat==='talent'));
  return r.category==='talent';
}
function lessonOfRec(r){return S.lessons.find(x=>x.recId===r.id)||null}
function lessonKidOf(r){
  if(r.kind!=='family')return r.childId||'';
  const name=r._kid?null:LINK[r.category];
  if(!name){const c=S.children.find(x=>r._kid&&x.id===r.childId);return c?c.id:''}
  const c=S.children.find(x=>String(x.name).trim()===name);
  return c?c.id:'';
}
function lessonPrefill(r){
  return {childId:lessonKidOf(r),name:String(r.title).replace(/（家庭支出）$/,''),org:r.org||'',price:r.amount,buyDate:r.date,recId:r.id};
}
function lessonNote(r){
  if(!isTalentRec(r))return '';
  const pk=lessonOfRec(r);
  if(!pk)return '<small style="color:var(--warn);font-weight:700">🎨 還沒有建立堂數紀錄</small>';
  const st=lessonStats(pk);
  const col=st.status==='done'?'var(--ok)':st.warns.length?'var(--warn)':'var(--ink)';
  return '<small style="color:'+col+';font-weight:700">🎨 已上 '+st.used+' / 共 '+st.total+' 堂，剩 '+st.remaining+' 堂'+(st.status==='done'?'（已用完）':st.status==='ended'?'（已結束）':'')+'</small>';
}
function wdLabel(ds){return '週'+'日一二三四五六'[new Date(ds+'T00:00:00').getDay()]}
function lessonStats(p){
  const logs=S.lessonLogs.filter(x=>x.pkgId===p.id).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  const used=logs.reduce((a,x)=>a+(+x.count||0),0),total=(+p.total||0)+(+p.bonus||0),remaining=total-used;
  const today=todayStr(),days=p.expire?daysBetween(today,p.expire):null;
  const expired=days!==null&&days<0&&remaining>0;
  const unit=(+p.price>0&&total>0)?Math.round(p.price/total):null;
  let status='active';
  if(p.ended)status='ended';else if(remaining<=0)status='done';
  const warns=[];
  if(status==='active'){
    if(expired)warns.push('已過期，還剩 '+remaining+' 堂沒用到');
    else if(days!==null&&days<=30)warns.push(days+' 天後到期，還剩 '+remaining+' 堂');
    if(remaining>0&&remaining<=2)warns.push('只剩 '+remaining+' 堂，可以準備續購');
  }
  return {logs:logs,used:used,total:total,remaining:remaining,days:days,expired:expired,unit:unit,status:status,warns:warns};
}
async function quickUseLesson(p,n){
  n=n||1;

  if(st.remaining<n){toast('只剩 '+st.remaining+' 堂，不夠扣 '+n+' 堂');return}
  const ldate=S.lesDate||todayStr();
  try{
    await put('lessonlogs',{id:newId('l'),pkgId:p.id,date:ldate,count:n,note:'',createdBy:me,createdAt:Date.now()});
    toast('已記錄 '+mdLabel(ldate)+'（'+wdLabel(ldate)+'）上課 '+n+' 堂，剩 '+(st.remaining-n)+' 堂');
  }catch(e){toast(errMsg(e))}
}

const KM_PRESETS={

  'points-out':['兌換獎品','兌換活動','兌換成零用金','其他']
};
async function putKmBonus(cfg){
  if(S.mode==='sync'){await S.db.collection('settings').doc('kmbonus').set(cfg);return}
  S.kmBonus=cfg;persistLocal();render();
}
function weekBounds(ds){
  const d=new Date(ds+'T00:00:00'),dow=(d.getDay()+6)%7,st=new Date(d);st.setDate(d.getDate()-dow);
  const en=new Date(st);en.setDate(st.getDate()+6);
  const f=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
  return [f(st),f(en)];
}
function kmSaveBonuses(cid){
  const cfg=S.kmBonus||{enabled:true,threshold:100,bonus:5};
  if(!cfg.enabled||!(+cfg.threshold>=0)||!(+cfg.bonus>0))return [];
  const real=S.kidMoney.filter(x=>x.childId===cid&&x.kind==='money');
  if(!real.length)return [];
  const first=real.reduce((m,x)=>x.date<m?x.date:m,real[0].date),today=todayStr();
  const balUpTo=cutoff=>real.reduce((a,x)=>x.date<=cutoff?a+(x.dir==='in'?1:-1)*(+x.amount||0):a,0);
  let [wS,wE]=weekBounds(first),out=[],guard=0,vbTotal=0;
  while(wE<today&&guard<104){
    const spent=real.filter(x=>x.dir==='out'&&x.date>=wS&&x.date<=wE).reduce((a,x)=>a+(+x.amount||0),0);
    const balEnd=balUpTo(wE)+vbTotal;
    if(spent===0&&balEnd>=cfg.threshold){
      out.push({id:'sv:'+cid+':'+wS,childId:cid,kind:'money',dir:'in',amount:+cfg.bonus,date:wE,label:'零用金利息',note:'這週（'+mdLabel(wS)+'–'+mdLabel(wE)+'）完全沒有花費，餘額達 NT$'+num(cfg.threshold)+' 以上，系統自動加發利息',virtual:true,createdAt:0});
      vbTotal+=+cfg.bonus;
    }
    guard++;[wS,wE]=weekBounds(addDaysStr(wE,1));
  }
  return out;
}
function kmAll(cid){return S.kidMoney.filter(x=>x.childId===cid).concat(kmSaveBonuses(cid))}
function kmBal(cid,kind){
  const today=todayStr();
  return kmAll(cid).reduce((a,x)=>x.kind===kind&&x.date<=today?a+(x.dir==='in'?1:-1)*(+x.amount||0):a,0);

function kmSum(cid,kind,dir,ym){
  const today=todayStr();

    (cfg.enabled?'<p class="note" style="margin-top:0">鼓勵儲蓄：一週（週一到週日）完全沒有花費，且餘額達到 NT$'+num(cfg.threshold)+' 以上，系統自動多給 NT$'+num(cfg.bonus)+' 利息，標示 🐷。</p>':'')+
    '<div class="famtotal"><span class="lbl">目前餘額</span><span class="num" style="color:'+(mb<0?'var(--bad)':'inherit')+'"><small>NT$</small>'+num(mb)+'</span></div>'+
    '<div class="tally muted"><span>本月收入</span><b style="color:var(--ok)">＋'+money(kmSum(cid,'money','in',ym))+'</b></div>'+
    '<div class="tally muted"><span>本月支出</span><b style="color:var(--bad)">－'+money(kmSum(cid,'money','out',ym))+'</b></div>'+
    '<div class="tally muted"><span>累計收入／累計支出</span><b>'+money(kmSum(cid,'money','in'))+' ／ '+money(kmSum(cid,'money','out'))+'</b></div>';
  if(!ml.length)h+='<p class="note">這個月沒有零用金紀錄。</p>';
  ml.forEach(x=>{h+=kmRow(x)});
  h+='</section>';
  // sources
  const srcTot={},srcMon={};
  S.kidMoney.forEach(x=>{
    if(x.childId!==cid||x.kind!=='money'||x.dir!=='in'||x.virtual)return;
    const k=x.source||'（未填來源）';
    if(x.date<=todayStr())srcTot[k]=(srcTot[k]||0)+(+x.amount||0);
    if(x.date.slice(0,7)===ym)srcMon[k]=(srcMon[k]||0)+(+x.amount||0);
  });
  const srcKeys=Object.keys(srcTot).sort((a,b)=>srcTot[b]-srcTot[a]),srcAll=srcKeys.reduce((a,k)=>a+srcTot[k],0);
  h+='<section class="sec"><div class="sec-head"><h2>零用金來源</h2><span class="meta">累計收入 '+money(srcAll)+'</span></div>';
  if(!srcKeys.length)h+='<p class="note" style="margin:0">還沒有收入。記「零用金收入」時可以選來源，例如爸爸、媽媽、阿公阿嬤，也能自己新增。</p>';
  srcKeys.forEach(k=>{
    h+='<div class="catln wide" style="grid-template-columns:112px 1fr auto;cursor:default"><span>'+esc(k)+'</span><span class="bar"><i style="width:'+(srcAll?Math.round(srcTot[k]/srcAll*100):0)+'%;background:'+esc(c.color)+'"></i></span><b>'+money(srcTot[k])+'</b></div>'+(srcMon[k]?'<div class="meta" style="margin:-4px 0 6px 0;text-align:right">'+ymLabel(ym)+' 收到 '+money(srcMon[k])+'</div>':'');
  });
  h+='</section>';
  // points
  const pl=listOf('points');
  h+='<section class="sec"><div class="sec-head"><h2>⭐ 獎勵點數</h2><span class="meta">'+ymLabel(ym)+'</span></div>'+
    '<div class="famtotal"><span class="lbl">目前點數</span><span class="num">'+num(pb)+'<small style="margin-left:4px">點</small></span></div>'+
    '<div class="tally muted"><span>本月獲得</span><b style="color:var(--ok)">＋'+num(kmSum(cid,'points','in',ym))+' 點</b></div>'+
    '<div class="tally muted"><span>本月兌換</span><b style="color:var(--bad)">－'+num(kmSum(cid,'points','out',ym))+' 點</b></div>'+
    '<div class="tally muted"><span>累計獲得／累計兌換</span><b>'+num(kmSum(cid,'points','in'))+' ／ '+num(kmSum(cid,'points','out'))+' 點</b></div>';
  if(!pl.length)h+='<p class="note">這個月沒有點數紀錄。</p>';
  pl.forEach(x=>{h+=kmRow(x)});
  h+='</section>';
  return h;
}
function openKmBonusSheet(){
  const c=S.kmBonus||{enabled:true,threshold:100,bonus:5};
  const html='<div class="sheet-head"><h2>儲蓄獎勵設定</h2><button class="iconbtn" data-action="close-sheet" aria-label="關閉">✕</button></div>'+
    '<form id="kmb-form" autocomplete="off"><div class="field"><label class="chk"><input type="checkbox" name="enabled" value="1"'+(c.enabled!==false?' checked':'')+'><span>開啟儲蓄獎勵<small>每週（週一到週日）花費不到門檻金額，自動多給獎勵金</small></span></label></div>'+
    '<div class="two"><div class="field"><label for="kb-th">餘額門檻（NT$）</label><input type="number" id="kb-th" name="threshold" min="0" step="1" inputmode="numeric" value="'+esc(c.threshold)+'"></div>'+
    '<div class="field"><label for="kb-bn">利息金額（NT$）</label><input type="number" id="kb-bn" name="bonus" min="1" step="1" inputmode="numeric" value="'+esc(c.bonus)+'"></div></div>'+
    '<p class="hint">套用到所有孩子。每週（週一到週日）結束時，如果那一週完全沒有花任何零用金，而且餘額達到門檻以上，系統自動加發利息，標示 🐷，不用手動記，也不能編輯或刪除。</p>'+
    '<div class="btnrow"><button type="submit" class="btn primary grow" id="kb-save">儲存</button></div></form>';
  openSheet(html,sh=>{
    $('#kmb-form',sh).addEventListener('submit',async ev=>{
      ev.preventDefault();
      const fd=new FormData(ev.target),btn=$('#kb-save',sh);
      const th=Math.max(0,Math.round(Number(fd.get('threshold'))||0)),bn=Math.max(0,Math.round(Number(fd.get('bonus'))||0));
      if(fd.get('enabled')&&!(bn>0)){toast('請輸入獎勵金額');return}

      catch(e){btn.disabled=false;toast(errMsg(e))}
    });
  });
}

function openKmSheet(e,pre){
  const isNew=!e;
  if(!S.children.length){toast('請先到「系統設定」新增孩子');return}
  if(e&&e.pairId){openKmPairSheet(e);return}
  const r=e?{type:e.kind+'-'+e.dir,childId:e.childId,date:e.date,amount:e.amount,label:e.label||'',note:e.note||'',source:e.source||'',toolId:e.toolId||'',expId:e.expId||null}:Object.assign({type:'money-in',childId:S.kmKid||S.children[0].id,date:todayStr(),amount:'',label:'',note:'',source:'',toolId:''},pre||{});
  const TYPES=[['money-in','🐷 零用金收入'],['money-out','🐷 零用金支出'],['points-in','⭐ 獲得點數'],['points-out','⭐ 兌換點數']];
  const html='<div class="sheet-head"><h2>'+(isNew?'記零用金／點數':'編輯紀錄')+'</h2><button class="iconbtn" data-action="close-sheet" aria-label="關閉">✕</button></div>'+
    '<form id="km-form" autocomplete="off">'+

    '<div class="field"><span class="lab">種類</span><div class="chips">'+TYPES.map(t=>'<label class="chip"><input type="radio" name="ktype" value="'+t[0]+'"'+(t[0]===r.type?' checked':'')+(isNew?'':(t[0]!==r.type?' disabled':''))+'><span>'+t[1]+'</span></label>').join('')+'</div></div>'+
    '<div class="two"><div class="field"><label for="km-amt" id="km-amt-l">金額（NT$）</label><input type="number" id="km-amt" name="amount" required min="1" step="1" inputmode="numeric" value="'+esc(r.amount)+'"></div>'+
    '<div class="field"><label for="km-date">日期</label><input type="date" id="km-date" name="date" required value="'+esc(r.date)+'"></div></div>'+
    '<div class="field"><label for="km-label">項目</label><input type="text" id="km-label" name="label" maxlength="24" placeholder="例：每週零用金、完成功課" value="'+esc(r.label)+'"><div class="chips" id="km-presets" style="margin-top:6px"></div></div>'+
    '<div class="field" id="km-src-f" hidden><span class="lab">零用金來源</span><input type="hidden" name="source" value="'+esc(r.source)+'"><div class="chips" id="km-srcs"></div><div style="display:flex;gap:8px;margin-top:8px"><input type="text" id="km-newsrc" maxlength="12" placeholder="新增來源，例：姑姑、班導師" style="flex:1;min-height:46px;border:1.5px solid var(--edge);background:var(--field);border-radius:6px;padding:8px 10px"><button type="button" class="btn" id="km-addsrc">＋ 新增來源</button></div></div>'+
    '<div class="field" id="km-tool-f" hidden><label for="km-tool">從哪裡拿出來（選填）</label><select id="km-tool" name="toolId">'+carPaySelect(r.toolId)+'</select></div>'+
    '<div class="field" id="km-mkexp-f" hidden><label class="chk"><input type="checkbox" name="mkexp" value="1"'+(r.expId?' checked':'')+'><span>同時記到家庭支出<small>從上面選的支付方式扣款，算進家庭支出統計（'+childOf(r.childId).name+'　類別）</small></span></label>'+(r.expId?'<p class="hint" style="color:var(--ok)">這筆已經記到家庭支出，改內容時會一起更新。</p>':'')+'</div>'+
    '<div class="field"><label for="km-note">備註</label><input type="text" id="km-note" name="note" maxlength="40" value="'+esc(r.note)+'"></div>'+
    (isNew?'<div class="field" id="km-rep-f"><label for="km-rep">每月固定？</label><select id="km-rep" name="repeat"><option value="0">不重複</option>'+[1,2,3,5,11].map(n=>'<option value="'+n+'">再建立未來 '+n+' 個月</option>').join('')+'</select></div>':'')+
    (isNew?'<div class="field" id="km-conv-f" hidden><label class="chk"><input type="checkbox" name="conv" value="1"><span>同時轉成零用金<small>兌換的點數換成錢，直接加到零用金餘額</small></span></label><div id="km-conv-amt" hidden style="margin-top:8px"><label for="km-convamt">換成多少零用金（NT$）</label><input type="number" id="km-convamt" name="convAmt" min="1" step="1" inputmode="numeric" style="width:100%;min-height:46px;border:1.5px solid var(--edge);background:var(--field);border-radius:6px;padding:8px 10px"></div></div>':'')+
    '<p class="hint" id="km-bal"></p>'+
    '<div class="btnrow"><button type="submit" class="btn primary grow" id="km-save">儲存</button>'+(isNew?'':'<button type="button" class="btn danger" id="km-del">刪除</button>')+'</div></form>';
  openSheet(html,sh=>{
    const form=$('#km-form',sh);
    const curType=()=>form.elements.ktype.value||r.type;
    const curChild=()=>form.elements.child.value;
    const balOf=()=>{const t=curType(),k=t.split('-')[0];let b=kmBal(curChild(),k);if(e&&e.childId===curChild()&&e.kind===k)b-=(e.dir==='in'?1:-1)*(+e.amount||0);return b};
    const srcIn=form.elements.source;
    const renderSrcs=()=>{
      const cur=srcIn.value,list=S.kmSources.slice();
      if(cur&&list.indexOf(cur)<0)list.push(cur);
      $('#km-srcs',sh).innerHTML=list.map(x=>'<span style="display:inline-flex;align-items:center"><button type="button" class="fchip" data-src="'+esc(x)+'" aria-pressed="'+(x===cur)+'">'+esc(x)+'</button>'+(KM_DEFAULT_SOURCES.indexOf(x)<0&&S.kmSources.indexOf(x)>=0?'<button type="button" class="linkbtn" data-srcdel="'+esc(x)+'" aria-label="刪除來源 '+esc(x)+'" style="min-height:32px;padding:0 6px">✕</button>':'')+'</span>').join('');
    };
    const sync=()=>{
      const t=curType(),isM=t.startsWith('money'),out=t.endsWith('out');
      $('#km-amt-l',sh).textContent=isM?'金額（NT$）':'點數';
      const pr=$('#km-presets',sh);
      pr.innerHTML=(KM_PRESETS[t]||[]).map(x=>'<button type="button" class="fchip" data-preset="'+esc(x)+'">'+esc(x)+'</button>').join('');
      const rf=$('#km-rep-f',sh);if(rf)rf.hidden=!(t==='money-in');
      $('#km-src-f',sh).hidden=!(t==='money-in');
      $('#km-tool-f',sh).hidden=!(t==='money-in');
      $('#km-mkexp-f',sh).hidden=!(t==='money-in');
      renderSrcs();
      const cf=$('#km-conv-f',sh);if(cf)cf.hidden=(t!=='points-out');
      const b=balOf();
      $('#km-bal',sh).textContent=out?('目前'+(isM?'零用金餘額 '+money(b):'點數 '+num(b)+' 點')+'，不能超過這個數字'):'';
    };
    form.addEventListener('change',ev=>{
      if(ev.target.name==='ktype'||ev.target.name==='child')sync();
      if(ev.target.name==='conv')$('#km-conv-amt',sh).hidden=!ev.target.checked;
    });
    sh.addEventListener('click',async ev=>{
      const p=ev.target.closest('[data-preset]');if(p)$('#km-label',sh).value=p.dataset.preset;
      const sc=ev.target.closest('[data-src]');
      if(sc){srcIn.value=(srcIn.value===sc.dataset.src)?'':sc.dataset.src;renderSrcs()}
      const sd=ev.target.closest('[data-srcdel]');
      if(sd){
        const name=sd.dataset.srcdel;
        try{await putKmSources(S.kmSources.filter(x=>x!==name));if(srcIn.value===name)srcIn.value='';renderSrcs();toast('已刪除來源「'+name+'」')}catch(er){toast(errMsg(er))}
      }
    });
    $('#km-addsrc',sh).addEventListener('click',async()=>{
      const inp=$('#km-newsrc',sh),name=inp.value.trim();
      if(!name){toast('請輸入來源名稱');return}
      try{
        if(S.kmSources.indexOf(name)<0)await putKmSources(S.kmSources.concat([name]));
        srcIn.value=name;inp.value='';renderSrcs();toast('已新增來源「'+name+'」');
      }catch(er){toast(errMsg(er))}
    });
    sync();
    form.addEventListener('submit',async ev=>{
      ev.preventDefault();
      const fd=new FormData(form),btn=$('#km-save',sh),t=curType(),kind=t.split('-')[0],dir=t.split('-')[1],cid=curChild();
      const amt=Math.round(Number(fd.get('amount')));
      if(!(amt>0)){toast(kind==='money'?'請輸入金額':'請輸入點數');return}
      if(dir==='out'&&amt>balOf()){toast((kind==='money'?'零用金餘額':'點數')+'不夠，目前只有 '+(kind==='money'?money(balOf()):num(balOf())+' 點'));return}
      const conv=(t==='points-out'&&isNew&&fd.get('conv'))?Math.round(Number(fd.get('convAmt'))):0;
      if(t==='points-out'&&isNew&&fd.get('conv')&&!(conv>0)){toast('請輸入要換成多少零用金');return}
      const me=S.me&&S.me.id?S.me.id:null,label=String(fd.get('label')||'').trim(),note=String(fd.get('note')||'').trim(),date=fd.get('date');
      const extra=(isNew&&t==='money-in')?(+fd.get('repeat')||0):0;
      const toolId=t==='money-in'?(fd.get('toolId')||''):'',mkexp=t==='money-in'&&!!fd.get('mkexp');
      btn.disabled=true;btn.textContent='儲存中…';
      try{
        let expId=(!isNew&&e.expId)||null;
        if(t==='money-in'){
          if(mkexp){
            const childName=childOf(cid).name,catKey=Object.keys(LINK).find(k=>LINK[k]===childName),famCat=catKey||'famother';
            const title='零用金：'+(label||childName);
            if(expId){
              const ex=payRecs().find(z=>z.id===expId);
              if(ex)await put('records',Object.assign({},ex,carPayFields(toolId,date),{amount:amt,date:date,paidDate:date,title:title,updatedBy:me,updatedAt:Date.now()}));
            }else{
              expId=await carExpense(title,amt,date,toolId,'給'+childName+'的零用金');
              await put('records',Object.assign({},payRecs().find(z=>z.id===expId),{category:famCat}));
            }
          }else if(expId){
            expId=null;
          }
        }
        for(let i=0;i<=extra;i++){
          const id=isNew?newId('m'):e.id,pid=conv?newId('q'):null;
          await put('kidmoney',{id:id,childId:cid,kind:kind,dir:dir,amount:amt,date:i===0?date:addMonthsDate(date,i),label:label,note:note,source:t==='money-in'?String(fd.get('source')||''):'',toolId:i===0?toolId:'',expId:i===0?expId:null,pairId:pid,createdBy:isNew?me:(e.createdBy||me),createdAt:isNew?Date.now()+i:(e.createdAt||Date.now())});
          if(conv)await put('kidmoney',{id:newId('m'),childId:cid,kind:'money',dir:'in',amount:conv,date:date,label:label||'點數兌換',note:note,source:'點數兌換',pairId:pid,createdBy:me,createdAt:Date.now()});
        }
        closeSheet();toast(isNew?(extra?'已建立 '+(extra+1)+' 筆':'已記錄'):'已更新');
      }catch(er){btn.disabled=false;btn.textContent='儲存';toast(errMsg(er))}
    });
    const dl=$('#km-del',sh);
    if(dl)dl.addEventListener('click',async()=>{
      const b=kmBal(e.childId,e.kind)-(e.dir==='in'?1:-1)*(+e.amount||0);
      if(e.dir==='in'&&b<0){toast('刪掉這筆會讓'+(e.kind==='money'?'零用金':'點數')+'餘額變成負數，請先處理後面的支出');return}
      const ok=await confirmSheet('要刪除這筆紀錄嗎？餘額會跟著改變。'+(e.expId?'（連動的家庭支出不會一起刪，要刪請自己到家庭支出處理）':''),'刪除');
      if(!ok)return;
      try{await del('kidmoney',e.id);toast('已刪除')}catch(er){toast(errMsg(er))}
    });
  });
}
function openKmPairSheet(e){
  const mate=S.kidMoney.find(x=>x.pairId===e.pairId&&x.id!==e.id);
  const html='<div class="sheet-head"><h2>點數兌換成零用金</h2><button class="iconbtn" data-action="close-sheet" aria-label="關閉">✕</button></div>'+
    '<p class="msg"><b>'+esc(childOf(e.childId).name)+'</b>　'+mdLabel(e.date)+'<br>兌換 '+num((e.kind==='points'?e:mate||e).amount)+' 點，換成零用金 '+money(((e.kind==='money'?e:mate)||e).amount)+'</p>'+
    '<p class="hint">這是一次兌換，點數和零用金是一起記的。要修改的話，請先刪除再重新記一次。</p>'+
    '<div class="btnrow"><button type="button" class="btn danger grow" id="kp-del">刪除這次兌換（點數退回、零用金扣掉）</button></div>';
  openSheet(html,sh=>{
    $('#kp-del',sh).addEventListener('click',async()=>{
      const money0=(e.kind==='money'?e:mate),bal=kmBal(e.childId,'money');
      if(money0&&bal-(+money0.amount||0)<0){toast('零用金餘額不夠扣回，請先處理後面的支出');return}
      const ok=await confirmSheet('要刪除這次兌換嗎？點數會退回，換來的零用金會扣掉。','刪除');
      if(!ok)return;
      try{for(const x of S.kidMoney.filter(z=>z.pairId===e.pairId))await del('kidmoney',x.id);toast('已刪除');}catch(er){toast(errMsg(er))}
    });
  });
}

const carInfo=()=>Object.assign({},CAR_DEFAULT,S.car||{});
const carPlanItems=()=>((S.carPlan&&S.carPlan.length)?S.carPlan:CAR_DEFAULT_PLAN);
function carPoints(){
  const c=carInfo(),pts=[{date:c.regDate,odo:0},{date:c.odoDate,odo:+c.odo||0}];
  S.carLogs.forEach(l=>{if(l.date&&+l.odo>0)pts.push({date:l.date,odo:+l.odo})});
  S.carFuel.forEach(f=>{if(f.date&&+f.odo>0)pts.push({date:f.date,odo:+f.odo})});
  return pts.sort((a,b)=>a.date.localeCompare(b.date)||a.odo-b.odo);
}
function carOdoNow(){return carPoints().reduce((m,p)=>Math.max(m,p.odo),0)}
function carOdoDate(){const o=carOdoNow(),p=carPoints().filter(x=>x.odo===o);return p.length?p[p.length-1].date:carInfo().odoDate}
function carKmPerDay(){
  const c=carInfo();
  if(+c.kmPerMonth>0)return c.kmPerMonth/30.4;
  const pts=carPoints().filter(p=>p.odo>0),today=todayStr();
  const recent=pts.filter(p=>daysBetween(p.date,today)<=240);
  if(recent.length>=2){
    const a=recent[0],b=recent[recent.length-1],d=daysBetween(a.date,b.date);
    if(d>=30&&b.odo>a.odo)return (b.odo-a.odo)/d;
  }
  const last=pts[pts.length-1]||{date:today,odo:0},d=Math.max(30,daysBetween(c.regDate,last.date));

}
const carOdoAt=d=>Math.round(carOdoNow()+carKmPerDay()*daysBetween(carOdoDate(),d));
function carItemState(it){
  const odo=carOdoNow(),today=todayStr(),rate=carKmPerDay(),c=carInfo();
  const logs=S.carLogs.filter(l=>(l.items||[]).indexOf(it.key)>=0).sort((a,b)=>b.date.localeCompare(a.date)||(+b.odo||0)-(+a.odo||0));
  const last=logs[0]||null;

  if(last){
    if(+it.km>0)dueKm=(+last.odo||0)+ +it.km;
    if(+it.months>0)dueDate=addMonthsDate(last.date,+it.months);
  }else if(it.dueDate){dueDate=it.dueDate}
  else{
    if(+it.km>0)dueKm=+it.km;

    if((dueKm!==null&&dueKm<=odo)||(dueDate&&dueDate<=today))unknown=true;
  }

}
function carRoadmap(){
  const c=carInfo(),today=todayStr(),rate=carKmPerDay(),end=addMonthsDate(c.regDate,120),out=[];
  carPlanItems().filter(it=>it.enabled!==false).forEach(it=>{
    const st=carItemState(it);
    let cur=st.est||today;
    if(st.status==='unknown'||st.status==='overdue')cur=today;
    let n=0;
    while(cur<=end&&n<14){
      out.push({key:it.key,name:it.name,date:cur,odo:carOdoAt(cur),cost:+it.cost||0,first:n===0,flag:n===0&&(st.status==='unknown'||st.status==='overdue')});
      n++;
      const byM=+it.months>0?addMonthsDate(cur,+it.months):null;
      const byK=+it.km>0?addDaysStr(cur,Math.ceil(it.km/rate)):null;
      const nxt=(byM&&byK)?(byM<byK?byM:byK):(byM||byK);
      if(!nxt)break;
      cur=nxt;
    }
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));
}
function fuelStats(){
  const list=S.carFuel.slice().filter(f=>+f.odo>0&&+f.liters>0).sort((a,b)=>(+a.odo)-(+b.odo)||a.date.localeCompare(b.date));
  const segs=[];

  list.forEach(f=>{
    if(lastFull===null){if(f.full!==false)lastFull=f;return}
    acc+=+f.liters;accCost+=+f.amount||0;
    if(f.full!==false){
      const dist=(+f.odo)-(+lastFull.odo),prev=segs[segs.length-1];
      if(dist>=10&&acc>0){segs.push({date:f.date,odo:+f.odo,dist:dist,liters:acc,cost:accCost,kmpl:dist/acc,trip:f.trip||'mixed',id:f.id});lastFull=f}
      else if(prev&&prev.odo===+lastFull.odo){prev.liters+=acc;prev.cost+=accCost;prev.kmpl=prev.dist/prev.liters}
      else lastFull=f;

    }
  });
  const dist=segs.reduce((a,x)=>a+x.dist,0),lit=segs.reduce((a,x)=>a+x.liters,0),cost=segs.reduce((a,x)=>a+x.cost,0);
  const byTrip={};
  segs.forEach(x=>{const b=byTrip[x.trip]||(byTrip[x.trip]={dist:0,liters:0,n:0});b.dist+=x.dist;b.liters+=x.liters;b.n++});
  return {list:list,segs:segs,avg:lit>0?dist/lit:null,dist:dist,liters:lit,costPerKm:dist>0?cost/dist:null,byTrip:byTrip};
}

function openCardGroupSheet(id){
  const isNew=!id,g=isNew?{id:'',name:'',members:[]}:(S.cardGroups.find(x=>x.id===id)||{id:id,name:'',members:[]});
  const cards=S.payTools.filter(t=>t.type==='credit');
  const html='<div class="sheet-head"><h2>'+(isNew?'新增合併群組':'編輯合併群組')+'</h2><button class="iconbtn" data-action="close-sheet" aria-label="關閉">✕</button></div>'+
    '<form id="cg-form" autocomplete="off"><div class="field"><label for="cg-name">群組名稱</label><input type="text" id="cg-name" name="name" required maxlength="24" placeholder="例：中信信用卡（合併帳單）" value="'+esc(g.name)+'"></div>'+
    '<div class="field"><span class="lab">選擇要合併的信用卡（至少 2 張）</span><div class="chips">'+cards.map(t=>'<label class="chip"><input type="checkbox" name="mem" value="'+esc(t.id)+'"'+((g.members||[]).indexOf(t.id)>=0?' checked':'')+'><span>'+esc(toolLabel(t))+'</span></label>').join('')+'</div></div>'+
    '<p class="hint">這幾張卡的結帳日、付款日最好相同，合併後的帳單才會準確對齊。手動加減帳、標為已繳款都會套用到整個合併帳單。</p>'+
    '<div class="btnrow"><button type="submit" class="btn primary grow" id="cg-save">儲存</button>'+(isNew?'':'<button type="button" class="btn danger" id="cg-del">刪除</button>')+'</div></form>';
  openSheet(html,sh=>{
    $('#cg-form',sh).addEventListener('submit',async ev=>{
      ev.preventDefault();
      const fd=new FormData(ev.target),mem=fd.getAll('mem');
      if(mem.length<2){toast('請至少選擇 2 張信用卡');return}

      try{await putCardGroups(list);closeSheet();toast(isNew?'已新增群組':'已更新')}catch(e){toast(errMsg(e))}
    });
    const dl=$('#cg-del',sh);
    if(dl)dl.addEventListener('click',async()=>{
      const ok=await confirmSheet('要刪除「'+g.name+'」這個合併群組嗎？這幾張卡之後會分開顯示帳單，過去的帳款記錄不會受影響。','刪除');
      if(!ok)return;
      try{await putCardGroups(S.cardGroups.filter(x=>x.id!==g.id));toast('已刪除')}catch(e){toast(errMsg(e))}
    });
  });
}

const carYmd=d=>{const a=String(d||'').split('-');return a.length===3?a[0]+'/'+(+a[1])+'/'+(+a[2]):String(d||'')};

function carMeasLine(l){

  const parts=[];

function carSeries(kind){
  const out=[];
  S.carLogs.forEach(l=>{
    const m=l.measures;if(!m)return;
    let v=[];
    if(kind==='tread'&&m.tread)v=['lf','rf','lr','rr'].map(k=>m.tread[k]);
    if(kind==='padF'&&m.pad)v=[m.pad.lf,m.pad.rf];
    if(kind==='padR'&&m.pad)v=[m.pad.lr,m.pad.rr];
    v=v.filter(x=>x>0);
    if(v.length)out.push({date:l.date,odo:+l.odo,val:v.reduce((a,b)=>a+b,0)/v.length,min:Math.min.apply(null,v)});
  });
  return out.sort((a,b)=>a.odo-b.odo);
}
function carTrend(ser){
  if(ser.length<2)return null;
  const n=ser.length,mx=ser.reduce((a,x)=>a+x.odo,0)/n,my=ser.reduce((a,x)=>a+x.val,0)/n;
  let sxy=0,sxx=0;ser.forEach(x=>{sxy+=(x.odo-mx)*(x.val-my);sxx+=(x.odo-mx)*(x.odo-mx)});
  if(sxx<=0||ser[n-1].odo-ser[0].odo<2000)return null;
  return {slope:sxy/sxx,last:ser[n-1]};
}
function carReach(tr,target){
  if(!tr||tr.slope>=-0.00002)return null;
  if(tr.last.val<=target)return {done:true};
  const km=Math.round(tr.last.odo+(tr.last.val-target)/(-tr.slope)),rate=carKmPerDay(),d=addDaysStr(todayStr(),Math.max(0,Math.ceil((km-carOdoNow())/rate)));
  return {km:km,date:d};
}

    h+='</section>';

  const byPay={};

  const payKeys=Object.keys(byPay).sort((a,b)=>byPay[b].amt-byPay[a].amt);

  }
  h+='<section class="sec"><div class="sec-head"><h2>加油記錄</h2><span class="meta">'+list.length+' 筆</span></div>';
  if(!list.length)h+='<p class="note" style="margin:0">還沒有加油記錄。記下每次加油的日期、里程、公升數和金額，就會算出油耗。</p>';
  const segBy={};fs.segs.forEach(x=>{segBy[x.id]=x});
  list.forEach(f=>{
    const sg=segBy[f.id],unit=(+f.liters>0&&+f.amount>0)?(f.amount/f.liters):null;

    h+=S.canWrite?'<button class="row" data-action="car-edit-fuel" data-id="'+esc(f.id)+'" style="--kid:var(--c-meal)">'+inner+'</button>':'<div class="row" style="--kid:var(--c-meal)">'+inner+'</div>';
  });
  return h+'</section>';
}

/* ---------- 統一發票對獎 ---------- */
function einvoicePeriod(ds){
  if(!ds)return '';
  const y=+ds.slice(0,4),mo=+ds.slice(5,7),start=mo-((mo-1)%2);
  return y+'-'+pad(start);
}
function einvoicePeriodLabel(pk){
  if(!pk)return '';
  const y=+pk.slice(0,4),mo=+pk.slice(5,7);
  return y+' 年 '+mo+'-'+(mo+1)+' 月';
}
const EINV_TIERS=[[8,'頭獎',200000],[7,'二獎',40000],[6,'三獎',10000],[5,'四獎',4000],[4,'五獎',1000],[3,'六獎',200]];
function einvoiceBestFirst(n8,firstArr){
  let best=null;
  (firstArr||[]).forEach(f=>{
    if(!f||f.replace(/[^0-9]/g,'').length<8)return;
    const fn=f.replace(/[^0-9]/g,'').slice(-8);
    for(const t of EINV_TIERS){
      if(n8.slice(-t[0])===fn.slice(-t[0])){if(!best||t[2]>best.amount)best={tier:t[1],amount:t[2]};break}
    }
  });
  return best;
}
function einvoiceMatch(invNo,win){
  if(!invNo||!win)return null;
  const n8=String(invNo).replace(/[^0-9]/g,'').slice(-8);
  if(n8.length<8)return null;
  const sp=(win.special||'').replace(/[^0-9]/g,''),gr=(win.grand||'').replace(/[^0-9]/g,'');
  if(sp&&n8===sp)return{tier:'特別獎',amount:10000000};
  if(gr&&n8===gr)return{tier:'特獎',amount:2000000};
  return einvoiceBestFirst(n8,win.first);
}
async function putEinvoiceWin(list){
  if(S.mode==='sync'){await S.db.collection('settings').doc('einvoicewin').set({list:list});return}
  S.einvoiceWin=list;persistLocal();render();
}

function viewEinvoice(){
  const wins=S.einvoiceWin.slice().sort((a,b)=>b.period.localeCompare(a.period));
  const recs=einvoiceRecs();
  let h='<section class="sec"><div class="sec-head"><h2>統一發票對獎</h2><span class="meta">'+recs.length+' 張有記發票號碼</span></div>'+
    '<p class="note" style="margin-top:0">先在「記家庭支出」或「📷 掃發票」的時候填上發票號碼，這裡再輸入財政部公布的中獎號碼，系統會自動比對這一期的每一張發票。</p>'+
    (S.canWrite?'<div class="btnrow"><button class="btn primary" data-action="einv-edit" data-id="">＋ 輸入這期中獎號碼</button></div>':'')+'</section>';
  if(!wins.length)return h+'<section class="sec empty"><h2>還沒有中獎號碼</h2><p>統一發票每 2 個月開獎一次（1-2月、3-4月...），號碼可以到財政部電子發票整合服務平台查詢，或搜尋「統一發票 幾月 中獎號碼」。輸入之後，系統會自動比對這期所有有填發票號碼的支出。</p></section>';
  wins.forEach(win=>{
    const periodRecs=recs.filter(r=>einvoicePeriod(r.date)===win.period);
    const results=periodRecs.map(r=>({r:r,m:einvoiceMatch(r.einvoiceNo,win)}));
    const winners=results.filter(x=>x.m);
    const total=winners.reduce((a,x)=>a+x.m.amount,0);
    h+='<section class="sec" style="border-left:7px solid '+(winners.length?'var(--ok)':'var(--edge)')+'"><div class="sec-head"><h2>'+esc(einvoicePeriodLabel(win.period))+'</h2>'+(S.canWrite?'<button class="linkbtn" data-action="einv-edit" data-id="'+esc(win.id)+'">編輯號碼</button>':'')+'</div>'+
      '<p class="meta" style="margin:0 0 6px">特別獎 '+esc(win.special||'—')+'　特獎 '+esc(win.grand||'—')+'<br>頭獎 '+(win.first||[]).map(x=>esc(x||'—')).join('、')+'</p>';
    if(!periodRecs.length)h+='<p class="note" style="margin:0">這期沒有記過帶發票號碼的支出。</p>';
    else{

      results.sort((a,b)=>(b.m?b.m.amount:0)-(a.m?a.m.amount:0)||b.r.date.localeCompare(a.r.date)).forEach(x=>{

function openEinvoiceWinSheet(id){

      const fd=new FormData(ev.target),digits=v=>String(v||'').replace(/[^0-9]/g,'');

      const first=[0,1,2].map(i=>digits(fd.get('first'+i))).filter(Boolean);

      const others=S.einvoiceWin.filter(x=>x.id!==o.id&&x.period!==period);
      const final=others.concat([o]);
      try{await putEinvoiceWin(final);closeSheet();toast(isNew?'已新增':'已更新')}catch(e){toast(errMsg(e))}

      try{await putEinvoiceWin(S.einvoiceWin.filter(x=>x.id!==w.id));toast('已刪除')}catch(e){toast(errMsg(e))}
    });
  });

      const instFirst=Math.max(0,Number(fd.get('instFirst'))||0);

      const installment=instOn?{n:+fd.get('instN'),fee:Math.max(0,Number(fd.get('instFee'))||0),first:instFirst>0?instFirst:null}:null;
      S.lastTool=ptId;S.lastType=ptype;

      let plBase=null;

        const exl=extraRows.map(x=>{

          let title=String(fd.get('title')).trim();

function openRefundSheet(orig,ref){
  const isNew=!ref;
  const net=+orig.amount||0;
  const others=refundsOf(orig).filter(x=>!ref||x.id!==ref.id).reduce((a,x)=>a-(+x.amount||0),0);
  const maxRef=Math.max(0,net-others);
  const toolList=S.payTools.concat(S.accounts.map(a=>({id:a.id,name:acctLabel(a),type:'bank',cardNo:'',closeDay:null,payDay:null})));
  const origLines=payLinesOf(orig),defTool=ref?ref.payToolId:((origLines[0]&&origLines[0].toolId)||'');
  const optGroups=(pick)=>{
    let o='';
    ['cash','credit','prepaid','coupon','bank'].forEach(k=>{
      const l=toolList.filter(t=>t.type===k);
      if(l.length)o+='<optgroup label="'+PT_ICON[k]+' '+ptName(k)+'">'+l.map(t=>{const bb=toolBal(t);return '<option value="'+esc(t.id)+'"'+(t.id===pick?' selected':'')+'>'+esc(toolLabel(t))+(bb!==null?'・餘額 '+money(bb):'')+'</option>'}).join('')+'</optgroup>';
    });

  };
  const html='<div class="sheet-head"><h2>'+(isNew?'記退費':'編輯退費')+'</h2><button class="iconbtn" data-action="close-sheet" aria-label="關閉">✕</button></div>'+
    '<p class="msg"><b>'+esc(orig.title)+'</b>　原支出 '+money(net)+(others?'，已退 '+money(others):'')+'，最多還能退 '+money(maxRef)+'</p>'+
    '<form id="ref-form" autocomplete="off">'+
    '<div class="two"><div class="field"><label for="rf-amt">退費金額（NT$）</label><input type="number" id="rf-amt" name="amount" required min="1" max="'+maxRef+'" step="1" inputmode="numeric" value="'+esc(ref?-ref.amount:maxRef)+'"></div>'+
    '<div class="field"><label for="rf-date">退費日期</label><input type="date" id="rf-date" name="date" required value="'+esc(ref?ref.date:todayStr())+'"></div></div>'+
    '<div class="field"><label for="rf-tool">退回到</label><select id="rf-tool" name="tool">'+optGroups(defTool)+'</select><p class="hint" id="rf-hint"></p></div>'+
    '<div class="field"><label for="rf-note">備註（例：退貨、課程取消）</label><input type="text" id="rf-note" name="note" maxlength="40" value="'+esc(ref?ref.note:'')+'"></div>'+
    '<p class="hint">退費會記成一筆負數的支出，同類別的統計會跟著減少；退回現金、儲值卡或銀行帳戶，餘額會增加；退回信用卡，會抵減那個月的信用卡帳款。</p>'+
    '<div class="btnrow"><button type="submit" class="btn primary grow" id="rf-save">儲存退費</button>'+(isNew?'':'<button type="button" class="btn danger" id="rf-del">刪除</button>')+'</div></form>';
  openSheet(html,sh=>{
    const form=$('#ref-form',sh),sel=$('#rf-tool',sh),hint=$('#rf-hint',sh);
    const upd=()=>{
      const t=toolList.find(x=>x.id===sel.value)||null;
      hint.textContent=!t?'':t.type==='credit'?'退回信用卡：會在那張卡的帳單裡扣掉這筆金額':t.type==='bank'?'退回銀行帳戶：帳戶餘額會增加':HAS_BAL.indexOf(t.type)>=0?'退回後，'+BAL_NAME[t.type]+'會增加':'';
    };
    sel.addEventListener('change',upd);upd();
    form.addEventListener('submit',async ev=>{
      ev.preventDefault();
      const fd=new FormData(form),btn=$('#rf-save',sh),amt=Math.round(Number(fd.get('amount')));
      if(!(amt>0)){toast('請輸入退費金額');return}
      if(amt>maxRef){toast('退費金額不能超過還能退的 '+money(maxRef));return}
      const date=fd.get('date'),tid=fd.get('tool')||'',tl=toolList.find(t=>t.id===tid)||null,au=isAutoPrepaid(tl),fnd=fundOf(tl),eff=au?null:(fnd||tl);
      const c=eff?calcPayDates(eff,date):{close:'',due:''};
      const me=S.me&&S.me.id?S.me.id:null,base=String(orig.title).replace(/^退費：/,'');
      const o={
        id:isNew?newId('r'):ref.id,kind:orig.kind==='family'?'family':'kid',category:orig.category,title:'退費：'+base,org:orig.org||'',
        amount:-amt,date:date,status:'paid',dueDate:null,paidDate:date,payer:orig.payer||'',splits:null,note:String(fd.get('note')||'').trim(),
        refundOf:orig.id,major:false,gross:null,discounts:null,payLines:null,installment:null,
        payToolType:tl?(tl.type==='ptother'?'other':tl.type):'other',payToolId:tid||null,payToolName:tl?toolLabel(tl):null,payToolNote:null,
        payFundId:fnd?fnd.id:null,payFundName:fnd?toolLabel(fnd):null,payClose:c.close||null,payDue:c.due||null,
        policyId:null,policyDue:null,
        ...(orig.kind==='family'?{childId:null}:{childId:orig.childId}),
        createdBy:isNew?me:(ref.createdBy||me),createdAt:isNew?Date.now():(ref.createdAt||Date.now()),updatedBy:me,updatedAt:Date.now()
      };
      btn.disabled=true;btn.textContent='儲存中…';
      try{await put('records',o);closeSheet();toast(isNew?'已記錄退費':'已更新退費')}
      catch(e){btn.disabled=false;btn.textContent='儲存退費';toast(errMsg(e))}
    });
    const dl=$('#rf-del',sh);
    if(dl)dl.addEventListener('click',async()=>{

  openSheet(html,sh=>{

/* ---------- export ---------- */
async function exportLedgerCsv(acctId){
  if(!S.dl)return;
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['日期','項目','說明','收支','金額','是否已入基準餘額前']];
  const rangeOn=!!(S.inRangeFrom&&S.inRangeTo);
  let list;
  if(rangeOn){
    list=flowLedgerRange(S.inRangeFrom,S.inRangeTo,acctId);
  }else{
    const dates=[];
    S.family.forEach(r=>dates.push(r.date));S.records.forEach(r=>dates.push(r.date));S.flows.forEach(f=>dates.push(f.date));
    const acct=S.accounts.find(a=>a.id===acctId);
    if(acct&&acct.balanceDate)dates.push(acct.balanceDate);
    let minY=dates.length?dates.reduce((a,d)=>d<a?d:a).slice(0,7):todayStr().slice(0,7);
    const maxY=addMonths(todayStr().slice(0,7),12);
    list=flowLedgerRange(minY+'-01',dayInMonth(maxY,31),acctId);
  }
  list.forEach(x=>{
    const info=ledgerRowInfo(x);
    const kind=x.delta>0?'進帳':x.delta<0?'支出':'轉帳（不算進出）';
    rows.push([x.date,info.title,info.sub,kind,(x.delta>0?'':x.delta<0?'-':'')+x.amount,x.inBase?'是':'']);
  });
  if(rows.length<2){toast('這個帳戶'+(rangeOn?'在這個區間':'')+'沒有資金進出紀錄可以匯出');return}
  const header=rows[0],dataRows=rows.slice(1).sort((a,b)=>String(a[0]).localeCompare(String(b[0])));
  const csv='\uFEFF'+[header].concat(dataRows).map(r=>r.map(q).join(',')).join('\r\n');
  const name=acctId==='all'?'全部帳戶':acctLabel(S.accounts.find(a=>a.id===acctId)||S.payTools.find(t=>t.id===acctId)||{name:acctId});
  const period=rangeOn?S.inRangeFrom+'~'+S.inRangeTo:todayStr();
  try{await S.dl.save({filename:'資金進出明細-'+name.replace(/[\\/:*?"<>|]/g,'')+'-'+period+'.csv',data:csv});toast('已匯出')}
  catch(e){if(!e||e.code!=='declined')toast('無法匯出檔案')}
}

    case 'les-use':{const pk=S.lessons.find(x=>x.id===id);if(S.canWrite&&pk)quickUseLesson(pk,+t.dataset.n||1)}break;
    case 'les-create-from':{const r=payRecs().find(x=>x.id===id);if(S.canWrite&&r)openLessonSheet(null,lessonPrefill(r))}break;
    case 'les-today':S.lesDate='';render();break;
    case 'les-log':{const pk=S.lessons.find(x=>x.id===id);if(S.canWrite&&pk)openLessonLogSheet(pk)}break;
    case 'edit-lesslog':{const lg=S.lessonLogs.find(x=>x.id===id);const pk=lg&&S.lessons.find(x=>x.id===lg.pkgId);if(S.canWrite&&lg&&pk)openLessonLogSheet(pk,lg)}break;
    case 'add-adv':if(S.canWrite)openRecordSheet(null,'family',{advance:true,advDoc:'invoice'});break;
    case 'adv-claim':{const r=S.family.find(x=>x.id===id);if(S.canWrite&&r)openClaimSheet(r)}break;
    case 'adv-undo':{const r=S.family.find(x=>x.id===id);if(S.canWrite&&r)undoClaim(r)}break;
    case 'add-flow':if(S.canWrite)openFlowSheet(null,{type:t.dataset.type||'income'});break;
    case 'edit-flow':{const f=S.flows.find(x=>x.id===id);if(S.canWrite&&f)openFlowSheet(f)}break;
    case 'add-acct':if(S.canWrite)openAccountSheet();break;
    case 'edit-acct':{const a=S.accounts.find(x=>x.id===id);if(S.canWrite&&a)openAccountSheet(a)}break;
    case 'upd-bal':{const a=S.accounts.find(x=>x.id===id);if(S.canWrite&&a)openBalanceSheet(a)}break;
    case 'add-tool':if(S.canWrite)openToolSheet(null,t.dataset.type);break;
    case 'edit-tool':{const tl=S.payTools.find(x=>x.id===id);if(S.canWrite&&tl)openToolSheet(tl)}break;
    case 'add-child':openChildSheet();break;
    case 'edit-child':{const c=S.children.find(x=>x.id===id);if(c)openChildSheet(c)}break;
    case 'export':exportCsv();break;
    case 'export-ledger':exportLedgerCsv(S.inAcct||'all');break;
    case 'export-all':exportAll();break;
    case 'close-sheet':closeSheet();break;
    case 'show-unpaid':S.tab='detail';S.fStatus='unpaid';S.fPeriod='all';S.fKid='all';S.fCat='all';render();window.scrollTo(0,0);break;
  }
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.classList&&e.target.classList.contains('lesdate')){S.lesDate=(e.target.value&&e.target.value!==todayStr())?e.target.value:'';render();return}
  if(e.target&&e.target.id==='cf-buffer'){putCfBuffer(Math.max(0,Math.min(14,+e.target.value||0))).catch(err=>toast(errMsg(err)));return}
  if(e.target&&e.target.id==='imp-file'){
    const f=e.target.files&&e.target.files[0];
    window.__importData=null;S.importReady=false;S.importStatus='';
    if(!f){render();return}
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        let n=0;Object.keys(data).forEach(c=>{n+=Object.keys(data[c]||{}).length});
        window.__importData=data;
        S.importStatus='已讀取檔案，共 '+Object.keys(data).length+' 個分類、'+n+' 筆資料，按「開始匯入」寫入。';
        S.importReady=true;
      }catch(err){S.importStatus='這個檔案看起來不是有效的匯入檔（JSON 格式錯誤）。'}
      render();
    };
    r.readAsText(f,'utf-8');
    return;
  }
  const t=e.target.closest('[data-filter]');
  if(t){S[t.dataset.filter]=t.value;render()}
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='ins-q'){
    S.insQ=e.target.value;
    const el=document.getElementById('pol-list');if(el)el.innerHTML=polListHtml();
    const c=document.getElementById('pol-count');if(c)c.textContent=polCountText();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!root.hidden)closeSheet()});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset&&t.dataset.action){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});

/* ---------- init ---------- */
(async function init(){
  render();
  let db=null,user=null,dl=null;
  try{
    if(window.firebase&&window.__FIREBASE_CONFIG__){
      firebase.initializeApp(window.__FIREBASE_CONFIG__);
      db=firebase.firestore();
      // 簡易身分：只存在這台裝置的瀏覽器裡，用來標記「誰記的」，不是帳號登入
      let myId=localStorage.getItem('kidledger:myid'),myName=localStorage.getItem('kidledger:myname');
      if(!myId){myId='u_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('kidledger:myid',myId)}
      if(!myName){myName=prompt('第一次使用，請輸入你的稱呼（例如：爸爸、媽媽），之後不會再問')||'家人';localStorage.setItem('kidledger:myname',myName)}
      user={me:async()=>({id:myId,name:myName}),can:async()=>true};
      dl={save:async o=>{
        const blob=new Blob([o.data],{type:'text/csv;charset=utf-8'});
        const url=URL.createObjectURL(blob),a=document.createElement('a');
        a.href=url;a.download=o.filename||'export.csv';document.body.appendChild(a);a.click();
        setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},1000);
      }};
    }
  }catch(e){console.error('Firebase 初始化失敗',e)}
  S.user=user;S.dl=dl;
  if(user){
    try{S.me=await user.me()}catch(e){}
    try{S.canWrite=(await user.can('data.write'))!==false}catch(e){}
  }
  if(db){
    S.db=db;S.mode='sync';
    const toList=snap=>snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    const onErr=e=>{toast(e&&e.code==='revoked'?'連線已中斷，請重新整理頁面':'同步發生問題，請重新整理');S.loaded={c:true,r:true};render()};
    db.collection('children').onSnapshot(snap=>{
      S.children=toList(snap).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));S.loaded.c=true;render();
    },onErr);
    db.collection('records').onSnapshot(snap=>{
      const all=toList(snap).filter(r=>r&&typeof r.date==='string');S.records=all.filter(r=>r.kind!=='family');S.family=all.filter(r=>r.kind==='family');S.loaded.r=true;render();
    },onErr);
    db.collection('policies').onSnapshot(snap=>{
      S.policies=toList(snap).filter(x=>x&&typeof x.name==='string');render();
    },()=>{});
    db.collection('standing').onSnapshot(snap=>{
      S.standing=toList(snap).filter(x=>x&&typeof x.name==='string'&&typeof x.fromId==='string');render();
    },()=>{});
    db.collection('carlogs').onSnapshot(snap=>{
      S.carLogs=toList(snap).filter(x=>x&&typeof x.date==='string');render();
    },()=>{});
    db.collection('carfuel').onSnapshot(snap=>{
      S.carFuel=toList(snap).filter(x=>x&&typeof x.date==='string');render();
    },()=>{});
    db.collection('kidmoney').onSnapshot(snap=>{
      S.kidMoney=toList(snap).filter(x=>x&&typeof x.childId==='string'&&typeof x.date==='string');render();
    },()=>{});
    db.collection('lessons').onSnapshot(snap=>{
      S.lessons=toList(snap).filter(x=>x&&typeof x.name==='string');render();
    },()=>{});
    db.collection('lessonlogs').onSnapshot(snap=>{
      S.lessonLogs=toList(snap).filter(x=>x&&typeof x.pkgId==='string');render();
    },()=>{});
    db.collection('cardadj').onSnapshot(snap=>{
      S.cardAdj=toList(snap).filter(x=>x&&typeof x.due==='string');render();
    },()=>{});
    db.collection('flows').onSnapshot(snap=>{
      S.flows=toList(snap).filter(x=>x&&typeof x.date==='string');render();
    },()=>{});
    db.collection('cardstate').onSnapshot(snap=>{
      const m={};snap.docs.forEach(x=>{m[x.id]=x.data()});S.cardState=m;render();
    },()=>{});
    db.collection('settings').onSnapshot(snap=>{
      const d=snap.docs.find(x=>x.id==='family');const b=d?Number(d.data().budget):0;S.budget=b>0?b:0;
      const tt=snap.docs.find(x=>x.id==='paytools'),arr=tt?tt.data().tools:null;
      S.payTools=Array.isArray(arr)?arr:DEFAULT_TOOLS.slice();
      const cf=snap.docs.find(x=>x.id==='cashflow'),cb=cf?Number(cf.data().buffer):NaN;
      S.cfBuffer=(cb>=0&&cb<=14)?cb:3;
      const cd=snap.docs.find(x=>x.id==='car');S.car=cd?cd.data():null;
      const cad=snap.docs.find(x=>x.id==='carasks'),cal=cad?cad.data().items:null;S.carAsks=Array.isArray(cal)?cal:null;
      const cgd=snap.docs.find(x=>x.id==='cardgroups'),cgl=cgd?cgd.data().groups:null;S.cardGroups=Array.isArray(cgl)?cgl:[];
      const cpd=snap.docs.find(x=>x.id==='carplan'),cpl=cpd?cpd.data().items:null;S.carPlan=Array.isArray(cpl)?cpl:null;
      const eiw=snap.docs.find(x=>x.id==='einvoicewin'),eil=eiw?eiw.data().list:null;S.einvoiceWin=Array.isArray(eil)?eil:[];
      const kb=snap.docs.find(x=>x.id==='kmbonus');if(kb)S.kmBonus=Object.assign({enabled:true,threshold:100,bonus:5},kb.data());
      const ks=snap.docs.find(x=>x.id==='kmsources'),kl=ks?ks.data().list:null;
      S.kmSources=Array.isArray(kl)?kl:KM_DEFAULT_SOURCES.slice();
      const ac=snap.docs.find(x=>x.id==='accounts'),aa=ac?ac.data().accounts:null;
      S.accounts=Array.isArray(aa)?aa:[];
      render();
    },()=>{});
  }else{
    S.mode='local';loadLocal();render();
  }
})();
})();
</script>
</body>
</html>
